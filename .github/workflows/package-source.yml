name: Package Source

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve app version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1)
          test -n "$VERSION_NAME"
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Generate reproducible Gradle wrapper
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version | grep -Fq 'Gradle 8.9'

      - name: Package clean release source
        run: |
          set -euo pipefail
          zip -r "BorsaTakipV${APP_VERSION}-kaynak-kod.zip" . \
            -x '.git/*' \
               'app/build/*' \
               '.gradle/*' \
               '**/.gradle/*' \
               '**/build/*' \
               '*.b64' \
               'v*.b64' \
               '*patch*' \
               '*payload*' \
               'BORSA-TAKIP-V5.0.0-KAYNAK-KOD.zip' \
               '*.apk' \
               '*.zip'
          unzip -l "BorsaTakipV${APP_VERSION}-kaynak-kod.zip" | grep -Fq 'gradle/wrapper/gradle-wrapper.jar'
          unzip -l "BorsaTakipV${APP_VERSION}-kaynak-kod.zip" | grep -Fq 'gradlew'

      - name: Upload clean source artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV${{ env.APP_VERSION }}-kaynak-kod
          path: BorsaTakipV${{ env.APP_VERSION }}-kaynak-kod.zip
          if-no-files-found: error
