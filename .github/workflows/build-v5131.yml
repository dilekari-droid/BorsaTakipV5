name: Build V5.1.31 Verified APK

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5131_final_patch.b64'
      - '.github/workflows/build-v5131.yml'
  workflow_dispatch:

jobs:
  build-test-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: build-v5.1.28-apk
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct V5.1.31 source
        run: |
          set -euo pipefail
          rm -rf /tmp/v5131
          mkdir -p /tmp/v5131
          cat build_payload/v5128_part*.b64 | tr -d '\n' | base64 -d > /tmp/v5128.tar.xz
          xz -t /tmp/v5128.tar.xz
          tar -xJf /tmp/v5128.tar.xz -C /tmp/v5131
          git fetch origin main --depth=1
          git show origin/main:build_payload/v5129_ui.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5129.patch
          git show origin/main:build_payload/v5129_fix.b64 | tr -d '\n' | base64 -d > /tmp/v5129_fix.tar.xz
          cd /tmp/v5131
          patch -p1 --batch --forward < /tmp/v5129.patch || true
          xz -t /tmp/v5129_fix.tar.xz
          tar -xJf /tmp/v5129_fix.tar.xz -C /tmp/v5131
          cd "$GITHUB_WORKSPACE"
          for f in 00 01 02 03 04; do git show origin/main:build_payload/v5130_patch_part_${f}.b64; done | tr -d '\n' | base64 -d | xz -d > /tmp/v5130.patch
          git show origin/main:build_payload/v5130_backend.b64 | tr -d '\n' | base64 -d > /tmp/v5130_backend.tar.xz
          git show origin/main:build_payload/v5131_final_patch.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5131_final.patch
          cd /tmp/v5131
          patch -p4 --batch --forward < /tmp/v5130.patch || true
          xz -t /tmp/v5130_backend.tar.xz
          tar -xJf /tmp/v5130_backend.tar.xz -C /tmp/v5131
          patch -p4 --batch --forward < /tmp/v5131_final.patch
          rm -rf source_parts backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__
          grep -F 'versionName = "5.1.31"' app/build.gradle.kts
          grep -F 'versionCode = 81' app/build.gradle.kts
          test -f app/src/main/java/tr/borsatakip/v5/worker/ForwardOutcomeWorker.kt
          test -f app/src/main/java/tr/borsatakip/v5/worker/WorkScheduler.kt
          grep -F 'AtomicFile' app/src/main/java/tr/borsatakip/v5/data/SignalHistoryStore.kt
          grep -F 'GLOBAL_MUTEX' app/src/main/java/tr/borsatakip/v5/data/SignalHistoryStore.kt
          ! grep -F 'HttpURLConnection' app/src/main/java/tr/borsatakip/v5/data/BackendProvider.kt
          grep -F '@app.websocket("/v1/live")' backend/app/main.py
          test -f backend/tests/conftest.py

      - name: Backend tests from project root
        working-directory: /tmp/v5131
        run: |
          set -euo pipefail
          python -m venv /tmp/v5131-venv
          /tmp/v5131-venv/bin/python -m pip install --upgrade pip
          /tmp/v5131-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5131-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests
        working-directory: /tmp/v5131
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"

      - name: Android lint
        working-directory: /tmp/v5131
        run: |
          set -euo pipefail
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify debug APK
        working-directory: /tmp/v5131
        run: |
          set -euo pipefail
          gradle :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.31'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='81'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-debug.apk" > "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-debug.sha256"

      - name: Package clean V5.1.31 source
        run: |
          set -euo pipefail
          cd /tmp/v5131
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ source_parts
          zip -qr "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-Kaynak-Kod.zip" . -x '*.pyc' '*/__pycache__/*' 'source_parts/*'
          unzip -t "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/BorsaTakipV5.1.31-Kaynak-Kod.sha256"

      - name: Emulator API 35 instrumentation and screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            cd /tmp/v5131
            gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-instrumentation.txt"
            mkdir -p "$GITHUB_WORKSPACE/visual-screenshots"
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/visual-screenshots/. "$GITHUB_WORKSPACE/visual-screenshots/"
            find "$GITHUB_WORKSPACE/visual-screenshots" -name '*.png' -type f | sort > "$GITHUB_WORKSPACE/screenshot-list.txt"
            test $(wc -l < "$GITHUB_WORKSPACE/screenshot-list.txt") -ge 10

      - name: Upload V5.1.31 verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.31-verified
          path: |
            BorsaTakipV5.1.31-debug.apk
            BorsaTakipV5.1.31-debug.sha256
            BorsaTakipV5.1.31-Kaynak-Kod.zip
            BorsaTakipV5.1.31-Kaynak-Kod.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            android-instrumentation.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
            screenshot-list.txt
            visual-screenshots/*.png
          if-no-files-found: error
