name: Build V5.2.4 LIVE DATA + TradingView APK

on:
  push:
    branches:
      - v5.2.4-live-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified V5.2.2 base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-v521-chatgpt.yml').read_text().splitlines()
          targets = [
              'Restore verified V5.1.50 source',
              'Apply V5.2.1 research foundation patch',
              'Apply V5.2.1 REV1 security and provenance fixes',
          ]
          for n, target in enumerate(targets):
              marker = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {target}')
              run_line = next(i for i in range(marker, len(lines)) if lines[i].strip() == 'run: |')
              out = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/v522-base-step-{n}.sh').write_text('\n'.join(out) + '\n')
          PY
          for f in /tmp/v522-base-step-*.sh; do bash "$f"; done
          cd build_v5135
          sed -i 's/versionCode = 103/versionCode = 104/' app/build.gradle.kts
          sed -i 's/versionName = "5.2.1"/versionName = "5.2.2"/' app/build.gradle.kts
          grep -Fq 'versionCode = 104' app/build.gradle.kts
          grep -Fq 'versionName = "5.2.2"' app/build.gradle.kts

      - name: Apply V5.2.4 LIVE DATA Android patch
        shell: bash
        run: |
          set -euo pipefail
          cat build_payload/v524_live_android_patch_part00.b64 \
              build_payload/v524_live_android_patch_part01.b64 \
              build_payload/v524_live_android_patch_part02.b64 \
              build_payload/v524_live_android_patch_part03.b64 > /tmp/v524-live-android.b64
          base64 --decode /tmp/v524-live-android.b64 > /tmp/v524-live-android.patch.xz
          echo 'b481699937534c1f4761bbe2208076f5ba9cfe53ac2132b199c0ae8894cc73bb  /tmp/v524-live-android.patch.xz' | sha256sum -c -
          xz -t /tmp/v524-live-android.patch.xz
          xz -dc /tmp/v524-live-android.patch.xz > /tmp/v524-live-android.patch
          cd build_v5135
          set +e
          patch --batch --forward -p1 < /tmp/v524-live-android.patch
          PATCH_RC=$?
          set -e

          # The verified V5.2.1 REV1 base already contains the safer SettingsStore
          # defaults that V5.2.4 expects, so this specific reverse/reject is benign.
          if [ -f app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt.rej ]; then
            grep -Fq 'get() = p.getBoolean("experimental_providers_enabled", false)' app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt
            grep -Fq 'get() = p.getBoolean("yahoo_fallback_enabled", false)' app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt
            rm -f app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt.rej
          fi

          # Two V5.2.2 TARAMA-FIX-only test files are absent from the reconstructed
          # base; they do not ship in the APK. Any other reject is a hard failure.
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo 'Unexpected patch reject found:'
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          if [ "$PATCH_RC" -ne 0 ]; then
            echo 'Patch returned non-zero only because non-shipping test files were absent; verified production markers below.'
          fi

          grep -Fq 'versionCode = 107' app/build.gradle.kts
          grep -Fq 'versionName = "5.2.4"' app/build.gradle.kts
          grep -Fq 'includeCandles' app/src/main/java/tr/borsatakip/v5/data/LiveMarketSocket.kt
          grep -Fq 'tradingview_signal' app/src/main/java/tr/borsatakip/v5/data/LiveMarketSocket.kt
          grep -Fq 'btnTradingViewChart' app/src/main/java/tr/borsatakip/v5/ui/StockDetailActivity.kt
          grep -Fq 'RealTimeIntegrityPolicy.validate' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt

      - name: Run Android tests and build debug APK
        working-directory: build_v5135
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare V5.2.4 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build_v5135/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/tmp/v524-unzip.txt
          tail -n 1 /tmp/v524-unzip.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$AAPT" dump badging "$APK" > /tmp/v524-badging.txt
          grep -Fq "package: name='tr.borsatakip.v5' versionCode='107' versionName='5.2.4'" /tmp/v524-badging.txt
          "$ZIPALIGN" -c -v 4 "$APK" >/tmp/v524-zipalign.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/v524-signature.txt
          mkdir -p dist
          cp "$APK" dist/V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-debug.apk
          sha256sum dist/V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-debug.apk > dist/V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-debug.apk.sha256
          cp /tmp/v524-badging.txt dist/V5.2.4-badging.txt
          cp /tmp/v524-signature.txt dist/V5.2.4-signature.txt
          cp /tmp/v524-zipalign.txt dist/V5.2.4-zipalign.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-apk
          path: |
            dist/V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-debug.apk
            dist/V5-ARACI-KURUM-5.2.4-LIVE-DATA-TRADINGVIEW-debug.apk.sha256
            dist/V5.2.4-badging.txt
            dist/V5.2.4-signature.txt
            dist/V5.2.4-zipalign.txt
          if-no-files-found: error
          retention-days: 7
