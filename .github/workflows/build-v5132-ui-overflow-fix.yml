name: Build V5.1.32 Responsive UI Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5132_ui_overflow_fix_v2.b64'
      - '.github/workflows/build-v5132-ui-overflow-fix.yml'
  workflow_dispatch:

jobs:
  build-v5132:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download verified V5.1.31 Favorites baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v5132 /tmp/baseline
          mkdir -p /tmp/v5132 /tmp/baseline
          gh run download 34706151893 --repo "$GITHUB_REPOSITORY" --name V5.1.31-favorites-watchlist --dir /tmp/baseline
          unzip -q /tmp/baseline/V5.1.31-Kaynak-Kod.zip -d /tmp/v5132

      - name: Apply responsive UI overlay
        run: |
          set -euo pipefail
          base64 -d build_payload/v5132_ui_overflow_fix_v2.b64 > /tmp/v5132-ui.tar.xz
          xz -t /tmp/v5132-ui.tar.xz
          tar -xJf /tmp/v5132-ui.tar.xz -C /tmp/v5132

      - name: Verify requested UI changes and version
        working-directory: /tmp/v5132
        run: |
          set -euo pipefail
          grep -F 'versionName = "5.1.32"' app/build.gradle.kts
          grep -F 'versionCode = 82' app/build.gradle.kts
          grep -F 'android:insetTop="0dp"' app/src/main/res/layout/activity_favorites.xml
          grep -F 'android:id="@+id/favoriteCount"' app/src/main/res/layout/activity_favorites.xml
          grep -F 'android:id="@+id/btnRealOpportunityScan"' app/src/main/res/layout/activity_opportunity.xml
          grep -F 'android:maxLines="3"' app/src/main/res/layout/activity_opportunity.xml
          grep -F 'android:id="@+id/openGraph"' app/src/main/res/layout/item_opportunity.xml
          grep -F '08b_favorites' app/src/androidTest/kotlin/tr/borsatakip/v5/ui/VisualScreenshotTest.kt

      - name: Backend tests
        working-directory: /tmp/v5132
        run: |
          set -euo pipefail
          python -m venv /tmp/v5132-venv
          /tmp/v5132-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5132-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests
        working-directory: /tmp/v5132
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"

      - name: Android lint
        working-directory: /tmp/v5132
        run: |
          set -euo pipefail
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify V5.1.32 APK
        working-directory: /tmp/v5132
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.32'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='82'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/V5.1.32.apk"
          sha256sum "$GITHUB_WORKSPACE/V5.1.32.apk" > "$GITHUB_WORKSPACE/V5.1.32.apk.sha256"

      - name: Emulator screenshots for Opportunity and Favorites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: /tmp/v5132
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tr.borsatakip.v5.ui.VisualScreenshotTest
            mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/visual-screenshots "$GITHUB_WORKSPACE/ui-screenshots" || true

      - name: Package matching source
        run: |
          set -euo pipefail
          cd /tmp/v5132
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ .kotlin source_parts
          zip -qr "$GITHUB_WORKSPACE/V5.1.32-Kaynak-Kod.zip" . -x '*.pyc' '*/__pycache__/*' 'source_parts/*'
          unzip -t "$GITHUB_WORKSPACE/V5.1.32-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/V5.1.32-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/V5.1.32-Kaynak-Kod.zip.sha256"

      - name: Upload V5.1.32 APK source and visual checks
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.32-responsive-ui-fix
          path: |
            V5.1.32.apk
            V5.1.32.apk.sha256
            V5.1.32-Kaynak-Kod.zip
            V5.1.32-Kaynak-Kod.zip.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
            ui-screenshots/**
          if-no-files-found: error
