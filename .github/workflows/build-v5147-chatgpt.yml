name: Build V5.1.47 Strategy Comparison APK

on:
  push:
    branches:
      - chatgpt/build-v5147-strategy-comparison
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified V5.1.46 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-v5146-chatgpt.yml').read_text().splitlines()
          targets = ['Restore verified V5.1.45 source', 'Apply verified V5.1.46 forward semantics patch']
          for n, target in enumerate(targets):
              marker = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {target}')
              run_line = next(i for i in range(marker, len(lines)) if lines[i].strip() == 'run: |')
              out = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/v5146-step-{n}.sh').write_text('\n'.join(out) + '\n')
          PY
          for f in /tmp/v5146-step-*.sh; do bash "$f"; done
          grep -Fq 'versionName = "5.1.46"' build_v5135/app/build.gradle.kts
          grep -Fq 'versionCode = 96' build_v5135/app/build.gradle.kts

      - name: Apply V5.1.47 strategy comparison patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < build_payload/v5147.patch.xz.b64)" -eq 10048
          echo "1611863aff3f112bee8f2de3225f0f1456908127549033d6947076ee704a9d53  build_payload/v5147.patch.xz.b64" | sha256sum -c -
          base64 --decode build_payload/v5147.patch.xz.b64 > /tmp/v5147.patch.xz
          test "$(wc -c < /tmp/v5147.patch.xz)" -eq 7536
          echo "5d7543368a05af7e8429677515dba3612f2977f1c46752d639edfd339e9ff7ec  /tmp/v5147.patch.xz" | sha256sum -c -
          xz -dc /tmp/v5147.patch.xz > /tmp/v5147.patch
          test "$(wc -c < /tmp/v5147.patch)" -eq 28939
          echo "6b8b373221d95d6623f96dc05c6c2c304d7685285e0b538b4934743300548337  /tmp/v5147.patch" | sha256sum -c -
          cd build_v5135
          patch --batch -p1 < /tmp/v5147.patch
          grep -Fq 'versionName = "5.1.47"' app/build.gradle.kts
          grep -Fq 'versionCode = 97' app/build.gradle.kts
          test -f CHANGELOG_V5.1.47_STRATEGY_COMPARISON.md
          test -f app/src/main/java/tr/borsatakip/v5/analysis/StrategyProfileEngine.kt
          test -f app/src/main/java/tr/borsatakip/v5/analysis/StrategyComparisonMath.kt
          grep -Fq 'strategyIds' app/src/main/java/tr/borsatakip/v5/data/SignalHistoryStore.kt
          grep -Fq 'tabStrategies' app/src/main/java/tr/borsatakip/v5/ui/SignalHistoryActivity.kt

      - name: Run backend tests when pytest is available
        shell: bash
        run: |
          set -euo pipefail
          if python -c "import pytest" >/dev/null 2>&1; then
            (cd build_v5135/backend && python -m pytest -q)
          else
            echo "pytest is not installed on this runner; backend was validated separately and Android validation continues."
          fi

      - name: Run Android unit tests and build debug APK
        working-directory: build_v5135
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build_v5135/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p dist
          cp "$APK" dist/BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug.apk
          sha256sum dist/BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug.apk > dist/BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug-apk
          path: |
            dist/BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug.apk
            dist/BorsaTakipV5.1.47-STRATEGY-COMPARISON-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
