name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean
        run: gradle clean

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Debug build
        env:
          TRADINGVIEW_TEST_USERNAME: ${{ secrets.TRADINGVIEW_TEST_USERNAME }}
          TRADINGVIEW_TEST_PASSWORD: ${{ secrets.TRADINGVIEW_TEST_PASSWORD }}
        run: |
          gradle :app:assembleDebug
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/final/BorsaTakipV5.1.20-debug.apk

      - name: Release R8 smoke build
        run: gradle :app:assembleRelease

      - name: Verify APK and quality markers
        run: |
          APK=app/build/outputs/final/BorsaTakipV5.1.20-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          rm -f /tmp/all.dex
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do
            unzip -p "$APK" "$dex" >> /tmp/all.dex
          done
          for forbidden in \
            'api.ornek.com' \
            'BorsaTakip/5.1.2 Android' \
            'BorsaTakip/5.1.9 Android' \
            'BorsaTakip/5.1.12 Android' \
            'BorsaTakip/5.1.13 Android' \
            'DemoMarketDataProvider' \
            'LocalBistTestProvider'; do
            if strings /tmp/all.dex | grep -Fq "$forbidden"; then
              echo "Forbidden stale/test string found in APK: $forbidden"
              exit 1
            fi
          done
          grep -Fq 'WindowInsetsCompat.Type.systemBars()' app/src/main/java/tr/borsatakip/v5/ui/BaseActivity.kt
          grep -Fq 'MAX_SNAPSHOT_AGE_MS' app/src/main/java/tr/borsatakip/v5/analysis/TradingViewSnapshotScorer.kt
          grep -Fq 'confidenceCap' app/src/main/java/tr/borsatakip/v5/analysis/TradingViewSnapshotScorer.kt
          grep -Fq 'favoriteEmptyState' app/src/main/res/layout/activity_favorites.xml
          grep -Fq 'ColorUtils.blendARGB' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -Fq 'LONG' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -Fq 'SHORT' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -Fq 'strengthBar' app/src/main/res/layout/item_opportunity.xml
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionName='5.1.20'" /tmp/badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/manifest.txt
          grep -Fq 'android:allowBackup(0x01010280)=(type 0x12)0x0' /tmp/manifest.txt
          test -f app/build/outputs/mapping/release/mapping.txt
          echo 'V5.1.20 insets, freshness, confidence, neon UI, backup and R8 verification passed.'

      - name: Check release secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signed release skipped: ANDROID_* signing secrets are incomplete."
          fi

      - name: Prepare release keystore
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/borsatakip-release.jks"

      - name: Signed release build and verification
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          BORSA_KEYSTORE_PATH: ${{ runner.temp }}/borsatakip-release.jks
          BORSA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BORSA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BORSA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/final/BorsaTakipV5.1.20-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/final/BorsaTakipV5.1.20-release.apk | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -Eq "Verified using v3 scheme \(APK Signature Scheme v3\): true|Verified using v3.1 scheme \(APK Signature Scheme v3.1\): true" /tmp/apksigner.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.20-apk
          path: app/build/outputs/final/*.apk
          if-no-files-found: error
