name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve app version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1)
          VERSION_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/' | head -1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Resolved V$VERSION_NAME ($VERSION_CODE)"

      - name: Clean
        run: gradle clean

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Debug build
        run: |
          gradle :app:assembleDebug
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/final/BorsaTakipV${APP_VERSION}-debug.apk"

      - name: Release R8 smoke build
        run: gradle :app:assembleRelease

      - name: Verify APK and quality markers
        run: |
          set -euo pipefail
          APK="app/build/outputs/final/BorsaTakipV${APP_VERSION}-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 1 /tmp/apk-unzip-test.txt

          rm -f /tmp/all.dex
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" >> /tmp/all.dex
          done < <(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          for forbidden in \
            'api.ornek.com' \
            'DemoMarketDataProvider' \
            'LocalBistTestProvider' \
            'TV_TEST_USERNAME' \
            'TV_TEST_PASSWORD' \
            'TradingViewAuthClient' \
            'TradingViewBrowserLoginActivity' \
            'TradingViewScannerOpportunityProvider' \
            'TradingViewViopProvider' \
            'TradingViewSnapshotScorer' \
            'OTURUMU UYGULAMAYA AKTAR'; do
            if strings /tmp/all.dex | grep -Fq "$forbidden"; then
              echo "Forbidden legacy/test component found in APK: $forbidden"
              exit 1
            fi
          done

          require_marker() {
            local marker="$1"
            local file="$2"
            grep -Fq "$marker" "$file" || { echo "Required marker missing: $marker in $file"; exit 1; }
          }

          require_marker 'ProviderRouter(this@BistScanActivity)' app/src/main/java/tr/borsatakip/v5/ui/BistScanActivity.kt
          require_marker 'BistScanner(ProviderRouter(this@OpportunityActivity))' app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt
          require_marker 'RealTimeIntegrityPolicy.validate' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt
          require_marker 'LinearRegressionChannelCalculator.calculate' app/src/main/java/tr/borsatakip/v5/analysis/OpportunityEngine.kt
          require_marker 'RESEARCH_CANDIDATE' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt
          require_marker 'Araştırma adayı' app/src/main/java/tr/borsatakip/v5/ui/BistScanActivity.kt
          require_marker 'GERÇEK ZAMANLI AL/SAT SİNYALİ DEĞİLDİR' app/src/main/java/tr/borsatakip/v5/ui/BistScanActivity.kt
          require_marker 'ANALİZ İLERLEMESİ' app/src/main/java/tr/borsatakip/v5/ui/BistScanActivity.kt
          require_marker 'KARIŞIK VERİ' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          require_marker 'dataConfidenceScore = dataConfidence.first' app/src/main/java/tr/borsatakip/v5/analysis/OpportunityEngine.kt
          require_marker 'R.color.green' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          require_marker 'R.color.red' app/src/main/java/tr/borsatakip/v5/ui/FavoriteAdapter.kt
          require_marker 'CustomTabsIntent' app/src/main/java/tr/borsatakip/v5/ui/SettingsActivity.kt
          require_marker 'INTEGRITY_REJECTED' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt
          require_marker 'NO_SIGNAL' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt
          require_marker 'TIMEOUT' app/src/main/java/tr/borsatakip/v5/data/ScanContracts.kt
          require_marker 'RATE_LIMIT' app/src/main/java/tr/borsatakip/v5/data/ScanContracts.kt
          require_marker 'DATA_INSUFFICIENT' app/src/main/java/tr/borsatakip/v5/data/ScanContracts.kt
          require_marker 'MAX_ATTEMPTS = 3' app/src/main/java/tr/borsatakip/v5/data/MobileMarketDataProvider.kt
          require_marker 'MAX_ATTEMPTS = 3' app/src/main/java/tr/borsatakip/v5/data/YahooFallbackProvider.kt
          require_marker 'MAX_DATA_AGE_MS = 60_000L' app/src/main/java/tr/borsatakip/v5/data/RealTimeIntegrityPolicy.kt
          require_marker 'MAX_DECLARED_DELAY_SECONDS = 5' app/src/main/java/tr/borsatakip/v5/data/RealTimeIntegrityPolicy.kt
          require_marker 'currentSessionIncluded' app/src/main/java/tr/borsatakip/v5/data/MobileMarketDataProvider.kt
          require_marker 'realtime' backend/app/main.py
          require_marker 'currentSessionIncluded' backend/app/main.py
          require_marker 'strictRealtime' backend/app/main.py
          require_marker 'ANLIK ✓' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          require_marker 'finalSignalScore.coerceIn(0, 100)' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          require_marker 'TEKNİK UYUM' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          require_marker 'VERİ KAPSAMI' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          require_marker 'WindowInsetsCompat.Type.systemBars()' app/src/main/java/tr/borsatakip/v5/ui/BaseActivity.kt
          require_marker 'bg_screen_gradient' app/src/main/res/layout/activity_main.xml

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          grep -Fq "versionName='${APP_VERSION}'" /tmp/badging.txt
          grep -Fq "versionCode='${APP_VERSION_CODE}'" /tmp/badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -Fq 'android:allowBackup(0x01010280)=(type 0x12)0x0' /tmp/manifest.txt
          test -f app/build/outputs/mapping/release/mapping.txt
          echo "V${APP_VERSION} delayed-research separation, dynamic data confidence, LRC integration and APK version checks passed."

      - name: Check release secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signed release skipped: ANDROID_* signing secrets are incomplete."
          fi

      - name: Prepare release keystore
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/borsatakip-release.jks"

      - name: Signed release build and verification
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          BORSA_KEYSTORE_PATH: ${{ runner.temp }}/borsatakip-release.jks
          BORSA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BORSA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BORSA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/final/BorsaTakipV${APP_VERSION}-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "app/build/outputs/final/BorsaTakipV${APP_VERSION}-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV${{ env.APP_VERSION }}-apk
          path: app/build/outputs/final/*.apk
          if-no-files-found: error
