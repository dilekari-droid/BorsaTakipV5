name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean
        run: gradle clean

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Debug build
        env:
          TRADINGVIEW_TEST_USERNAME: ${{ secrets.TRADINGVIEW_TEST_USERNAME }}
          TRADINGVIEW_TEST_PASSWORD: ${{ secrets.TRADINGVIEW_TEST_PASSWORD }}
        run: |
          gradle :app:assembleDebug
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/final/BorsaTakipV5.1.20-debug.apk

      - name: Release R8 smoke build
        run: gradle :app:assembleRelease

      - name: Verify APK and quality markers
        run: |
          set -euo pipefail
          APK=app/build/outputs/final/BorsaTakipV5.1.20-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 1 /tmp/apk-unzip-test.txt

          rm -f /tmp/all.dex
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" >> /tmp/all.dex
          done < <(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          for forbidden in 'api.ornek.com' 'DemoMarketDataProvider' 'LocalBistTestProvider'; do
            if strings /tmp/all.dex | grep -Fq "$forbidden"; then
              echo "Forbidden production string found in APK: $forbidden"
              exit 1
            fi
          done
          echo 'APK placeholder/demo checks passed.'

          require_marker() {
            local marker="$1"
            local file="$2"
            if ! grep -Fq "$marker" "$file"; then
              echo "Required marker missing: $marker in $file"
              exit 1
            fi
            echo "OK marker: $marker"
          }

          require_marker 'BuildConfig.VERSION_NAME' app/src/main/java/tr/borsatakip/v5/data/TradingViewScannerOpportunityProvider.kt
          require_marker 'BuildConfig.VERSION_NAME' app/src/main/java/tr/borsatakip/v5/data/TradingViewAuthClient.kt
          require_marker 'BuildConfig.VERSION_NAME' app/src/main/java/tr/borsatakip/v5/data/TradingViewViopProvider.kt
          require_marker 'BuildConfig.VERSION_NAME' app/src/main/java/tr/borsatakip/v5/data/YahooFallbackProvider.kt
          require_marker 'WindowInsetsCompat.Type.systemBars()' app/src/main/java/tr/borsatakip/v5/ui/BaseActivity.kt
          require_marker 'MAX_SNAPSHOT_AGE_MS' app/src/main/java/tr/borsatakip/v5/analysis/TradingViewSnapshotScorer.kt
          require_marker 'confidenceCap' app/src/main/java/tr/borsatakip/v5/analysis/TradingViewSnapshotScorer.kt
          require_marker 'favoriteEmptyState' app/src/main/res/layout/activity_favorites.xml
          require_marker 'ColorUtils.blendARGB' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          require_marker 'finalSignalScore.coerceIn(0, 100)' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          require_marker 'strengthBar' app/src/main/res/layout/item_opportunity.xml

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo 'Android aapt not found/executable.'
            exit 1
          fi
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          if ! grep -Fq "versionName='5.1.20'" /tmp/badging.txt; then
            echo 'APK versionName is not 5.1.20.'
            cat /tmp/badging.txt
            exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          if ! grep -Fq 'android:allowBackup(0x01010280)=(type 0x12)0x0' /tmp/manifest.txt; then
            echo 'allowBackup=false verification failed.'
            exit 1
          fi
          test -f app/build/outputs/mapping/release/mapping.txt
          echo 'V5.1.20 APK, dynamic User-Agent, insets, freshness, confidence cap, neon UI, backup and R8 checks passed.'

      - name: Check release secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signed release skipped: ANDROID_* signing secrets are incomplete."
          fi

      - name: Prepare release keystore
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/borsatakip-release.jks"

      - name: Signed release build and verification
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          BORSA_KEYSTORE_PATH: ${{ runner.temp }}/borsatakip-release.jks
          BORSA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BORSA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BORSA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/final/BorsaTakipV5.1.20-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/final/BorsaTakipV5.1.20-release.apk | tee /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -Eq "Verified using v3 scheme \(APK Signature Scheme v3\): true|Verified using v3.1 scheme \(APK Signature Scheme v3.1\): true" /tmp/apksigner.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.20-apk
          path: app/build/outputs/final/*.apk
          if-no-files-found: error
