name: V5.4.1 FINAL Isolated APK

on:
  workflow_dispatch:
  push:
    branches: [ v5.4.1-final-isolated-apk ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore V5.4.1 FINAL source only
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/dilekari-droid/BorsaTakipV5/build-v5.4.1-final-apk/build_payload'
          : > /tmp/v541.b64
          for n in 000 001 002 003 004 005 006 007 008 009; do
            curl -fsSL "$BASE/v541_final_part_${n}.b64" >> /tmp/v541.b64
          done
          curl -fsSL "$BASE/v541b_part_010.b64" >> /tmp/v541.b64
          base64 -d /tmp/v541.b64 > /tmp/v541.tar.xz
          xz -t /tmp/v541.tar.xz
          tar -xJf /tmp/v541.tar.xz -C .

      - name: Enforce V5.4.1 identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s,n1=re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 541', s, count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "5.4.1"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version fields not found exactly once')
          p.write_text(s)
          PY
          grep -F 'versionCode = 541' app/build.gradle.kts
          grep -F 'versionName = "5.4.1"' app/build.gradle.kts

      - name: Build V5.4.1 FINAL APK
        run: |
          set -euo pipefail
          gradle clean :app:assembleDebug
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/final/V5-ARACI-KURUM-5.4.1-FINAL.apk

      - name: Verify APK identity and SHA-256
        run: |
          set -euo pipefail
          APK='app/build/outputs/final/V5-ARACI-KURUM-5.4.1-FINAL.apk'
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='541'" /tmp/badging.txt
          grep -Fq "versionName='5.4.1'" /tmp/badging.txt
          sha256sum "$APK" | tee app/build/outputs/final/V5-ARACI-KURUM-5.4.1-FINAL.apk.sha256

      - name: Upload V5.4.1 FINAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.4.1-FINAL
          path: |
            app/build/outputs/final/V5-ARACI-KURUM-5.4.1-FINAL.apk
            app/build/outputs/final/V5-ARACI-KURUM-5.4.1-FINAL.apk.sha256
          if-no-files-found: error
