name: Build V5.1.30 Hardening APK

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5130_patch_part_*.b64'
      - '.github/workflows/build-v5130.yml'
  workflow_dispatch:

jobs:
  build-test-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V5.1.28 payload branch
        uses: actions/checkout@v4
        with:
          ref: build-v5.1.28-apk
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct V5.1.29 then apply V5.1.30 hardening patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5130
          cat build_payload/v5128_part*.b64 | tr -d '\n' | base64 -d > /tmp/v5128.tar.xz
          xz -t /tmp/v5128.tar.xz
          tar -xJf /tmp/v5128.tar.xz -C /tmp/v5130
          git fetch origin main --depth=1
          git show origin/main:build_payload/v5129_ui.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5129.patch
          git show origin/main:build_payload/v5129_fix.b64 | tr -d '\n' | base64 -d > /tmp/v5129_fix.tar.xz
          cd /tmp/v5130
          patch -p1 --batch --forward < /tmp/v5129.patch || true
          xz -t /tmp/v5129_fix.tar.xz
          tar -xJf /tmp/v5129_fix.tar.xz -C /tmp/v5130
          cd "$GITHUB_WORKSPACE"
          for f in 00 01 02 03 04; do git show origin/main:build_payload/v5130_patch_part_${f}.b64; done | tr -d '\n' | base64 -d | xz -d > /tmp/v5130.patch
          cd /tmp/v5130
          patch -p4 --batch --forward < /tmp/v5130.patch
          rm -rf source_parts backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__
          grep -F 'versionName = "5.1.30"' app/build.gradle.kts
          grep -F 'versionCode = 80' app/build.gradle.kts
          test -f app/src/main/java/tr/borsatakip/v5/worker/ForwardOutcomeWorker.kt
          test -f app/src/main/java/tr/borsatakip/v5/worker/WorkScheduler.kt
          grep -F 'GLOBAL_MUTEX' app/src/main/java/tr/borsatakip/v5/data/SignalHistoryStore.kt
          grep -F 'lastTradingAt' app/src/main/java/tr/borsatakip/v5/model/Models.kt
          grep -F '@app.websocket("/v1/live")' backend/app/main.py

      - name: Backend dependency install and tests
        working-directory: /tmp/v5130
        run: |
          python -m venv /tmp/v5130-venv
          /tmp/v5130-venv/bin/python -m pip install --upgrade pip
          /tmp/v5130-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5130-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests and lint
        working-directory: /tmp/v5130
        run: |
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify debug APK
        working-directory: /tmp/v5130
        run: |
          set -euo pipefail
          gradle :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.30'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='80'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-debug.apk" > "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-debug.sha256"

      - name: Emulator API 35 visual/instrumentation verification
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            cd /tmp/v5130
            gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-instrumentation.txt"
            mkdir -p "$GITHUB_WORKSPACE/visual-screenshots"
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/visual-screenshots/. "$GITHUB_WORKSPACE/visual-screenshots/" || true
            find "$GITHUB_WORKSPACE/visual-screenshots" -name '*.png' -type f | sort > "$GITHUB_WORKSPACE/screenshot-list.txt"
            test $(wc -l < "$GITHUB_WORKSPACE/screenshot-list.txt") -ge 10

      - name: Package clean V5.1.30 source
        run: |
          set -euo pipefail
          cd /tmp/v5130
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__
          zip -qr "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-Kaynak-Kod.zip" . -x 'source_parts/*' '*.pyc' '*/__pycache__/*'
          unzip -t "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/BorsaTakipV5.1.30-Kaynak-Kod.sha256"

      - name: Upload V5.1.30 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.30-hardening
          path: |
            BorsaTakipV5.1.30-debug.apk
            BorsaTakipV5.1.30-debug.sha256
            BorsaTakipV5.1.30-Kaynak-Kod.zip
            BorsaTakipV5.1.30-Kaynak-Kod.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            android-instrumentation.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
            screenshot-list.txt
            visual-screenshots/*.png
          if-no-files-found: error
