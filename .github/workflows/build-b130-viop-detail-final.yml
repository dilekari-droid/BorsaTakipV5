name: B130 VIOP Contract Detail UI Final

on:
  push:
    branches: [v525-b130-viop-contract-detail-ui]
    paths:
      - '.github/workflows/build-b130-viop-detail-final.yml'
      - 'ci_payload/b130_viop_detail/B130-VIOP-CONTRACT-DETAIL-UI.patch.gz.b64'
      - 'ci_payload/b130_viop_detail/B130-VERSION-TEST.patch'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified B129 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b129
          mkdir -p /tmp/src /tmp/out /tmp/b129
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10517270488/zip" \
            -o /tmp/b129-artifact.zip
          unzip -q /tmp/b129-artifact.zip -d /tmp/b129
          SRCZIP=$(find /tmp/b129 -type f -name '*B129*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo 'c16c97c8bc39675c381c37937499c44ce1928cacd65722c8b0410f1f83328b59  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts
          grep -F 'versionCode = 129' /tmp/src/app/build.gradle.kts

      - name: Apply B130 UI-only patch
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$GITHUB_WORKSPACE/ci_payload/b130_viop_detail/B130-VIOP-CONTRACT-DETAIL-UI.patch.gz.b64"
          base64 -d "$PAYLOAD" > /tmp/B130.patch.gz
          gzip -t /tmp/B130.patch.gz
          gzip -dc /tmp/B130.patch.gz > /tmp/B130.patch
          echo 'b2cc1e569caba8d885b548c084b86bc1393ba401509e5d7c5d962d75927c9b70  /tmp/B130.patch' | sha256sum -c -
          ! grep -E '^diff .*app/src/main/java/tr/borsatakip/v5/(data|analysis)/' /tmp/B130.patch
          patch -p4 --batch --forward < /tmp/B130.patch
          patch -p1 --batch --forward < "$GITHUB_WORKSPACE/ci_payload/b130_viop_detail/B130-VERSION-TEST.patch"
          grep -F 'versionCode = 130' app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' app/build.gradle.kts
          grep -F 'versionCode = 130' app/src/test/java/tr/borsatakip/v5/data/B117EngineIntegritySourceTest.kt
          grep -F 'class ViopDetailActivity' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          grep -F 'ViopDetailPresentationPolicy' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          grep -F 'loadViopHistoryFlexible' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          grep -F 'OhlcvResampler.aggregate' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          ! grep -Fq 'contract.lastPrice' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          grep -F 'viopPriceChart' app/src/main/res/layout/activity_viop_detail.xml
          grep -F 'viopTabDepth' app/src/main/res/layout/activity_viop_detail.xml
          grep -F 'viopTabSignal' app/src/main/res/layout/activity_viop_detail.xml
          grep -F 'viopTabContract' app/src/main/res/layout/activity_viop_detail.xml
          cp /tmp/B130.patch /tmp/out/B130-VIOP-CONTRACT-DETAIL-UI.patch
          cp "$GITHUB_WORKSPACE/ci_payload/b130_viop_detail/B130-VERSION-TEST.patch" /tmp/out/B130-VERSION-TEST.patch
          sha256sum /tmp/B130.patch > /tmp/out/B130-VIOP-CONTRACT-DETAIL-UI.patch.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run all unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          discovered=int(os.environ['DISCOVERED'])
          tests=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
              skipped += int(root.attrib.get('skipped',0))
          passed=tests-failures-errors-skipped
          line=f'TEST_EXECUTED={tests} TEST_PASSED={passed} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}'
          print(line)
          with open('/tmp/test-summary.txt','a',encoding='utf-8') as f: f.write(line+'\n')
          if tests != discovered or failures or errors or skipped:
              raise SystemExit(line)
          PY

      - name: Lint debug
        working-directory: /tmp/src
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Assemble debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Generate Gradle wrapper for source package
        working-directory: /tmp/src
        run: gradle --no-daemon wrapper --gradle-version 8.10.2

      - name: Verify and export B130
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='130'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt

          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B130-VIOP-CONTRACT-DETAIL-UI-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src')
          out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B130-VIOP-CONTRACT-DETAIL-UI-Kaynak-Kod.zip')
          excluded={'.git','.gradle','.kotlin','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(part in excluded for part in p.relative_to(src).parts):
                      z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B130-VIOP-CONTRACT-DETAIL-UI-Kaynak-Kod.zip | tee /tmp/out/V5-ARACI-KURUM-5.2.5-B130-VIOP-CONTRACT-DETAIL-UI-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          cp /tmp/src/B130_CHANGES.md /tmp/out/B130_CHANGES.md
          {
            echo 'B130 VIOP CONTRACT DETAIL UI FINAL'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=130'
            echo 'versionName=5.2.5'
            echo 'base=B129-CANCELLATION-CACHE-RACE-FIX'
            echo 'runtime_data_analysis_architecture=UNCHANGED'
            echo 'viop_detail_contract_centered_ui=ENABLED'
            echo 'tabs=GRAPH_DEPTH_SIGNAL_CONTRACT'
            echo 'chart_real_ohlcv_only=ENABLED'
            echo 'timeframes=1m_3m_5m_15m_1h_4h_1d'
            echo 'four_hour_source=STRICT_60M_AGGREGATION'
            echo 'live_label_fail_closed=ENABLED'
            echo 'fake_depth_rows=FORBIDDEN'
            echo 'order_submission=NOT_IMPLEMENTED'
            echo 'watchlist=EXISTING_VIOP_WATCHLIST_STORE'
            echo 'gradle_wrapper_in_source_package=INCLUDED'
            cat /tmp/test-summary.txt
            echo 'production_viop_live_e2e=NOT_RUN_NO_REAL_BACKEND_CREDENTIALS'
            echo 'physical_device_test=NOT_RUN'
            echo 'instrumentation_test=NOT_RUN_NO_EMULATOR_OR_DEVICE'
            echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B130-VIOP-CONTRACT-DETAIL-UI-FINAL
          path: /tmp/out/*
          retention-days: 90
