name: B113 Dual Scan Timeframe Fix APK
on:
  push:
    branches: [v525-b113-verified-apk]
    paths:
      - '.github/workflows/build-b113-dual-scan-timeframe-fix.yml'
      - 'ci_payload/b113_fixes/dual_scan/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and apply all verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src && mkdir -p /tmp/src
          cat ci_payload/v525_b113_android_exact/part-*.b64 | base64 --decode > /tmp/src.tar.xz
          echo '7046afbb99b19c2b7e682c9aceee87f3c73260027b687f97ca941ceea6a2a93e  /tmp/src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/src.tar.xz -C /tmp/src
          cd /tmp/src
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_crash_fix.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_crash_fix.patch"
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_regression_test.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_regression_test.patch"
          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/b113_b114_acceptance_fix.part-*.b64 | base64 --decode > /tmp/accept.gz
          gzip -dc /tmp/accept.gz > /tmp/accept.patch
          echo '3f66ad69afab268e397856741af19a1505b966b6740cd083b2d23c7f00bb68c6  /tmp/accept.patch' | sha256sum -c -
          git apply --check --exclude='backend/**' /tmp/accept.patch
          git apply --exclude='backend/**' /tmp/accept.patch
          mkdir -p app/src/test/java/tr/borsatakip/v5/data
          cp "$GITHUB_WORKSPACE/ci_payload/b113_fixes/broad_tests/B113B114AcceptanceSourceTest.kt" app/src/test/java/tr/borsatakip/v5/data/B113B114AcceptanceSourceTest.kt
          echo '9b2358c6db6b2dbfe9dc02133f7e2a3c465a5fc8461974f1fc91efb07fa4a61b  '"$GITHUB_WORKSPACE"'/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch' | sha256sum -c -
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch"
          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/dual_scan/part-*.b64 | base64 --decode > /tmp/dual_scan.patch.gz
          gzip -dc /tmp/dual_scan.patch.gz > /tmp/dual_scan.patch
          echo 'e4e549dc52fa0585937a4cbbe1efa2a37a2f28221fc745c3eb13526b2200b3ac  /tmp/dual_scan.patch' | sha256sum -c -
          git apply --check /tmp/dual_scan.patch
          git apply /tmp/dual_scan.patch
      - name: Verify dual prompt source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts
          grep -F 'versionCode = 113' /tmp/src/app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' /tmp/src/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/src/app/src/main/java/tr/borsatakip/v5')
          tf=(root/'data/ScanTimeframe.kt').read_text()
          activity=(root/'ui/BistScanActivity.kt').read_text()
          interval=(root/'data/IntervalMarketDataProvider.kt').read_text()
          scanner=(root/'scan/BistScanner.kt').read_text()
          client=(root/'data/RealtimeScannerClient.kt').read_text()
          socket=(root/'data/RealtimeScannerSocket.kt').read_text()
          assert 'DAILY_STORED_MINUTES = 1440' in tf
          assert '"1 GÜN", "1d"' in tf
          assert 'value in 1..239' in tf
          assert 'RealtimeScannerClient(this@BistScanActivity)' not in activity
          assert 'BackendPreflightClient(this@BistScanActivity).checkBist()' in activity
          assert 'IntervalMarketDataProvider(baseProvider, analysisTimeframeMinutes)' in activity
          assert 'AppSession.lastOpportunities = emptyList()' in activity
          assert 'DIRECT_INTERVALS = setOf(1, 5, 15, 30, 60)' in interval
          assert 'delegate.fetchDailyHistory' in interval
          assert 'OhlcvResampler.aggregate(oneMinute, timeframe.storedMinutes)' in interval
          assert 'ScanPhase.LOADING_SYMBOLS' in scanner and 'ScanPhase.RANKING' in scanner and 'ScanPhase.STOPPED' in scanner
          assert 'coerceIn(1, 240)' not in client
          assert 'coerceIn(1, 240)' not in socket
          print('DUAL_SCAN_SOURCE_CONTRACT=PASS')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run 170 Android tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              total += int(r.attrib.get('tests',0))
              failures += int(r.attrib.get('failures',0))
              errors += int(r.attrib.get('errors',0))
              skipped += int(r.attrib.get('skipped',0))
          summary=f'TEST_TOTAL={total} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}'
          print(summary)
          Path='/tmp/test-summary.txt'
          open(Path,'w').write(summary+'\n')
          if total != 170 or failures != 0 or errors != 0 or skipped != 0:
              raise SystemExit(f'Expected 170/170 clean pass; got total={total}, failures={failures}, errors={errors}, skipped={skipped}')
          PY
      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='113'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/zipalign.txt
          mkdir -p /tmp/out
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B113-B114-DUAL-SCAN-TIMEFRAME-FIXED-debug.apk
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          cp /tmp/test-summary.txt /tmp/out/TEST_SUMMARY.txt
          {
            echo 'B113/B114 DUAL SCAN + TRUE TIMEFRAME VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=113'
            echo 'versionName=5.2.5'
            echo 'android_tests=170/170 passed'
            echo 'manual_scan_snapshot_shortcut=REMOVED'
            echo 'scan_state_machine=READY_STARTING_LOADING_SYMBOLS_LOADING_DATA_SCANNING_CALCULATING_RANKING_COMPLETED_ERROR_NO_DATA_STOPPED'
            echo 'quick_timeframes=1m,3m,5m,10m,15m,30m,60m,1d'
            echo 'daily_timeframe=REAL_1D_NOT_240M'
            echo 'minute_resampling=3m_10m_custom_from_real_1m'
            echo 'direct_intervals=1m_5m_15m_30m_60m'
            echo 'progress=PROVIDER_DERIVED_NOT_ANIMATION'
            echo 'provider_errors=VISIBLE_AND_LOGGED'
            echo 'live_provider_kimmr_5m_15m_60m_1d_test=NOT_RUN_NO_CREDENTIALS_IN_CI'
            echo 'physical_device_end_to_end_scan=NOT_RUN'
            echo 'signing=DEBUG'
            echo 'dual_scan_patch_sha256=e4e549dc52fa0585937a4cbbe1efa2a37a2f28221fc745c3eb13526b2200b3ac'
            echo "apk_sha256=$SHA"
          } > /tmp/out/PROVENANCE.txt
          sha256sum "$OUT" > "$OUT.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: B113-B114-DUAL-SCAN-TIMEFRAME-FIXED-APK
          path: /tmp/out/*
          retention-days: 90
