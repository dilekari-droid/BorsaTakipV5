name: B143 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/b143-final-release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout B143 build branch
        uses: actions/checkout@v4

      - name: Reconstruct exact B143 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            build_payloads/b143_overlay_part00.b64 \
            build_payloads/b143_overlay_part01.b64 \
            build_payloads/b143_overlay_part02.b64 \
            build_payloads/b143_overlay_part03a.b64 \
            build_payloads/b143_overlay_part03b.b64 \
            build_payloads/b143_overlay_part04.b64 \
            build_payloads/b143_overlay_part05.b64 > /tmp/b137-overlay.b64
          echo "103faff0ecda5c1b803b0cea932c602c4d60cfed6a26bb47b2ec02122f7ce74a  /tmp/b137-overlay.b64" | sha256sum -c -
          base64 -d /tmp/b137-overlay.b64 | tar -xJf -

          cat \
            build_payloads/b143_patch_part00.b64 \
            build_payloads/b143_patch_part01.b64 \
            build_payloads/b143_patch_part02.b64 \
            build_payloads/b143_patch_part03.b64 \
            build_payloads/b143_patch_part04.b64 \
            build_payloads/b143_patch_part05.b64 \
            build_payloads/b143_patch_part06.b64 > /tmp/b137-to-b143.patch.xz.b64
          echo "e759ca50a0ffc49bb22b0981b70d7ebfa8284151bc5843cc2711131db98f4e3d  /tmp/b137-to-b143.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/b137-to-b143.patch.xz.b64 | xz -d > /tmp/b137-to-b143.patch
          patch -p1 < /tmp/b137-to-b143.patch

      - name: Verify B143 production source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 143' app/build.gradle.kts
          grep -Fq 'versionName = "5.2.5"' app/build.gradle.kts
          { find app/src/main -type f -print0; printf '%s\0' app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle/wrapper/gradle-wrapper.properties; } \
            | sort -z | xargs -0 sha256sum > /tmp/B143_PRODUCTION_TREE_SHA256.txt
          echo "35b48791372274093aec0403e7dd8f57f3c3484753d51b3359e6de19da25dc40  /tmp/B143_PRODUCTION_TREE_SHA256.txt" | sha256sum -c -

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble B143 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/final/V5-ARACI-KURUM-5.2.5-B143-FINAL-RELEASE-HARDENING-debug.apk
          sha256sum app/build/outputs/final/V5-ARACI-KURUM-5.2.5-B143-FINAL-RELEASE-HARDENING-debug.apk | tee app/build/outputs/final/APK-SHA256.txt

      - name: Unit tests
        shell: bash
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        shell: bash
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/final/V5-ARACI-KURUM-5.2.5-B143-FINAL-RELEASE-HARDENING-debug.apk
          unzip -t "$APK" >/tmp/apk-test.txt
          tail -n 1 /tmp/apk-test.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee app/build/outputs/final/APK-BADGING.txt
          grep -Fq "versionCode='143'" app/build/outputs/final/APK-BADGING.txt
          grep -Fq "versionName='5.2.5'" app/build/outputs/final/APK-BADGING.txt

      - name: Upload B143 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B143-FINAL-APK
          path: |
            app/build/outputs/final/*.apk
            app/build/outputs/final/*.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
