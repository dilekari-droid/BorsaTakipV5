name: Build V5.1.44 Category Watchlists APK

on:
  push:
    branches:
      - chatgpt/build-v5144-category-watchlists
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified V5.1.43 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-v5143-chatgpt.yml').read_text().splitlines()
          targets = [
              'Restore verified V5.1.39 source',
              'Apply verified V5.1.40 category autofill patch',
              'Apply verified V5.1.42 combined patch',
              'Apply verified V5.1.43 decision context patch',
          ]
          for n, target in enumerate(targets):
              marker = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {target}')
              run_line = next(i for i in range(marker, len(lines)) if lines[i].strip() == 'run: |')
              out = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/v5143-step-{n}.sh').write_text('\n'.join(out) + '\n')
          PY
          for f in /tmp/v5143-step-*.sh; do bash "$f"; done
          grep -Fq 'versionName = "5.1.43"' build_v5135/app/build.gradle.kts
          grep -Fq 'versionCode = 93' build_v5135/app/build.gradle.kts

      - name: Apply verified V5.1.44 category watchlists patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < build_payload/v5144.patch.xz.b64)" -eq 10704
          echo "222be18e864511cfcb965fed54a595b80c250e45159173a1e6f6b3b3294bfbe9  build_payload/v5144.patch.xz.b64" | sha256sum -c -
          base64 --decode build_payload/v5144.patch.xz.b64 > /tmp/v5144.patch.xz
          test "$(wc -c < /tmp/v5144.patch.xz)" -eq 8028
          echo "331791fa7269afde7904dac79dc09727c96d72c3d63259dbb7f0c65e9a7b8c31  /tmp/v5144.patch.xz" | sha256sum -c -
          xz -dc /tmp/v5144.patch.xz > /tmp/v5144.patch
          test "$(wc -c < /tmp/v5144.patch)" -eq 39091
          echo "a1ba43cd279a38e0f3da8e094906749b4ea279ba7b383954055aa73188608a40  /tmp/v5144.patch" | sha256sum -c -
          cd build_v5135
          patch --batch -p1 < /tmp/v5144.patch
          grep -Fq 'versionName = "5.1.44"' app/build.gradle.kts
          grep -Fq 'versionCode = 94' app/build.gradle.kts
          grep -Fq 'fun symbols(category: ViopContractCategory)' app/src/main/java/tr/borsatakip/v5/data/ViopWatchlistStore.kt
          grep -Fq 'viopAddButton' app/src/main/res/layout/activity_viop_contracts.xml
          grep -Fq 'BIST30 Takip Listem' app/src/main/res/layout/activity_viop_contracts.xml
          test -f app/src/test/java/tr/borsatakip/v5/data/ViopCategoryWatchlistPolicyTest.kt

      - name: Run backend tests when backend payload is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build_v5135/backend ]; then
            (cd build_v5135/backend && python -m pytest -q)
          else
            echo "Backend payload not present; Android build remains authoritative."
          fi

      - name: Run Android unit tests and build debug APK
        working-directory: build_v5135
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build_v5135/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p dist
          cp "$APK" dist/BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug.apk
          sha256sum dist/BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug.apk > dist/BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug-apk
          path: |
            dist/BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug.apk
            dist/BorsaTakipV5.1.44-VIOP-CATEGORY-WATCHLISTS-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
