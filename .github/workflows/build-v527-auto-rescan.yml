name: Build V5.2.7 Auto Rescan APK

on:
  push:
    branches:
      - v5.2.7-auto-rescan
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified V5.2.2 base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-v521-chatgpt.yml').read_text().splitlines()
          targets = [
              'Restore verified V5.1.50 source',
              'Apply V5.2.1 research foundation patch',
              'Apply V5.2.1 REV1 security and provenance fixes',
          ]
          for n, target in enumerate(targets):
              marker = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {target}')
              run_line = next(i for i in range(marker, len(lines)) if lines[i].strip() == 'run: |')
              out = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/v522-base-step-{n}.sh').write_text('\n'.join(out) + '\n')
          PY
          for f in /tmp/v522-base-step-*.sh; do bash "$f"; done
          cd build_v5135
          sed -i 's/versionCode = 103/versionCode = 104/' app/build.gradle.kts
          sed -i 's/versionName = "5.2.1"/versionName = "5.2.2"/' app/build.gradle.kts

      - name: Apply verified V5.2.4 Android layer
        shell: bash
        run: |
          set -euo pipefail
          cat build_payload/v524_live_android_patch_part00.b64 \
              build_payload/v524_live_android_patch_part01.b64 \
              build_payload/v524_live_android_patch_part02.b64 \
              build_payload/v524_live_android_patch_part03.b64 > /tmp/v524-live-android.b64
          base64 --decode /tmp/v524-live-android.b64 > /tmp/v524-live-android.patch.xz
          echo 'b481699937534c1f4761bbe2208076f5ba9cfe53ac2132b199c0ae8894cc73bb  /tmp/v524-live-android.patch.xz' | sha256sum -c -
          xz -t /tmp/v524-live-android.patch.xz
          xz -dc /tmp/v524-live-android.patch.xz > /tmp/v524-live-android.patch
          cd build_v5135
          set +e
          patch --batch --forward -p1 < /tmp/v524-live-android.patch
          PATCH_RC=$?
          set -e
          if [ -f app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt.rej ]; then
            grep -Fq 'get() = p.getBoolean("experimental_providers_enabled", false)' app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt
            grep -Fq 'get() = p.getBoolean("yahoo_fallback_enabled", false)' app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt
            rm -f app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt.rej
          fi
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          if [ "$PATCH_RC" -ne 0 ]; then echo 'V5.2.4 patch non-zero only for absent non-shipping tests.'; fi

      - name: Apply V5.2.5 reproducible layer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build_payload/v525_android.patch.xz.b64 > /tmp/v525-android.patch.xz
          echo '510c75e24b321f791ff4fd1fdc6a3bfd908cd16fcdc76af9f27b4c954f21b33d  /tmp/v525-android.patch.xz' | sha256sum -c -
          xz -t /tmp/v525-android.patch.xz
          xz -dc /tmp/v525-android.patch.xz > /tmp/v525-android.patch
          cd build_v5135
          patch --batch --forward -p1 < /tmp/v525-android.patch
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi

      - name: Apply V5.2.6 trend brightness layer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build_payload/v526_trend.patch.xz.b64 > /tmp/v526-trend.patch.xz
          echo '2de63d0ac24662bbb9bf7eee8c312dad53d996167f9952664609f0ef11b9f5b4  /tmp/v526-trend.patch.xz' | sha256sum -c -
          xz -t /tmp/v526-trend.patch.xz
          xz -dc /tmp/v526-trend.patch.xz > /tmp/v526-trend.patch
          cd build_v5135
          patch --batch --forward -p1 < /tmp/v526-trend.patch
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          grep -Fq 'versionCode = 109' app/build.gradle.kts
          grep -Fq 'versionName = "5.2.6"' app/build.gradle.kts

      - name: Apply V5.2.7 auto rescan layer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build_payload/v527_auto_rescan.patch.xz.b64 > /tmp/v527-auto-rescan.patch.xz
          echo 'a16914147a5bfb862c678fe8cf1c0c98e9095c3e1084fd969c4c9914668db21d  /tmp/v527-auto-rescan.patch.xz' | sha256sum -c -
          xz -t /tmp/v527-auto-rescan.patch.xz
          xz -dc /tmp/v527-auto-rescan.patch.xz > /tmp/v527-auto-rescan.patch
          cd build_v5135
          patch --batch --forward -p1 < /tmp/v527-auto-rescan.patch
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          grep -Fq 'versionCode = 110' app/build.gradle.kts
          grep -Fq 'versionName = "5.2.7"' app/build.gradle.kts
          grep -Fq 'object AutoRescanPolicy' app/src/main/java/tr/borsatakip/v5/scan/AutoRescanPolicy.kt
          grep -Fq 'performRefresh("OTOMATİK")' app/src/main/java/tr/borsatakip/v5/ui/ScanResultsActivity.kt
          grep -Fq 'btnAutoCadence' app/src/main/res/layout/activity_scan_results.xml
          grep -Fq 'autoRescanEnabled' app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt

      - name: Generate and verify Gradle Wrapper
        working-directory: build_v5135
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Test and build with project wrapper
        working-directory: build_v5135
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build_v5135/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/tmp/v527-unzip.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/v527-badging.txt
          grep -Fq "package: name='tr.borsatakip.v5' versionCode='110' versionName='5.2.7'" /tmp/v527-badging.txt
          "$ZIPALIGN" -c -v 4 "$APK" >/tmp/v527-zipalign.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/v527-signature.txt
          mkdir -p dist
          cp "$APK" dist/V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-debug.apk
          sha256sum dist/V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-debug.apk > dist/V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-debug.apk.sha256
          cp /tmp/v527-badging.txt dist/V5.2.7-badging.txt
          cp /tmp/v527-signature.txt dist/V5.2.7-signature.txt
          cp /tmp/v527-zipalign.txt dist/V5.2.7-zipalign.txt
          cd build_v5135
          zip -q -r ../dist/V5.2.7-gradle-wrapper.zip gradlew gradlew.bat gradle/wrapper

      - name: Upload V5.2.7 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-BUILD
          path: |
            dist/V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-debug.apk
            dist/V5-ARACI-KURUM-5.2.7-AUTO-RESCAN-debug.apk.sha256
            dist/V5.2.7-badging.txt
            dist/V5.2.7-signature.txt
            dist/V5.2.7-zipalign.txt
            dist/V5.2.7-gradle-wrapper.zip
          if-no-files-found: error
          retention-days: 7
