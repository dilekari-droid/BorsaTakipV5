name: Build V5.1.29 UI APK and Screenshots

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5129_ui.b64'
      - '.github/workflows/build-v5129-ui.yml'
  workflow_dispatch:

jobs:
  build-and-visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V5.1.28 source payload branch
        uses: actions/checkout@v4
        with:
          ref: build-v5.1.28-apk
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct V5.1.28 and apply Android V5.1.29 patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5129
          cat build_payload/v5128_part*.b64 | tr -d '\n' | base64 -d > /tmp/v5128.tar.xz
          xz -t /tmp/v5128.tar.xz
          tar -xJf /tmp/v5128.tar.xz -C /tmp/v5129
          git fetch origin main --depth=1
          git show origin/main:build_payload/v5129_ui.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5129.patch
          cd /tmp/v5129
          patch -p1 --batch --forward < /tmp/v5129.patch || true
          grep -F 'versionName = "5.1.29"' app/build.gradle.kts
          grep -F 'versionCode = 79' app/build.gradle.kts
          test -f app/src/main/res/layout/activity_news.xml
          test -f app/src/main/res/layout/activity_technical_analysis.xml
          test -f app/src/main/res/layout/activity_viop_contracts.xml
          test -f app/src/androidTest/java/tr/borsatakip/v5/ui/VisualScreenshotTest.kt
          grep -F 'loadNews' app/src/main/java/tr/borsatakip/v5/data/BackendProvider.kt

      - name: Android unit tests and lint
        working-directory: /tmp/v5129
        run: |
          gradle :app:testDebugUnitTest
          gradle :app:lintDebug

      - name: Assemble debug APK
        working-directory: /tmp/v5129
        run: gradle :app:assembleDebug

      - name: Verify APK version and archive integrity
        run: |
          set -euo pipefail
          APK=/tmp/v5129/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-test.txt
          tail -n 1 /tmp/apk-test.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "versionName='5.1.29'" /tmp/badging.txt
          grep -F "versionCode='79'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/BorsaTakipV5.1.29-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/BorsaTakipV5.1.29-debug.apk" | tee "$GITHUB_WORKSPACE/BorsaTakipV5.1.29-debug.sha256"

      - name: Emulator visual verification and screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            cd /tmp/v5129
            gradle :app:connectedDebugAndroidTest
            mkdir -p "$GITHUB_WORKSPACE/visual-screenshots"
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/visual-screenshots/. "$GITHUB_WORKSPACE/visual-screenshots/"
            test $(find "$GITHUB_WORKSPACE/visual-screenshots" -name '*.png' | wc -l) -ge 10

      - name: Upload V5.1.29 APK and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.29-ui-apk-screenshots
          path: |
            BorsaTakipV5.1.29-debug.apk
            BorsaTakipV5.1.29-debug.sha256
            visual-screenshots/*.png
          if-no-files-found: error
