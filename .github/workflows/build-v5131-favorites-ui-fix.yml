name: Build V5.1.31 Favorites UI Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5131_favorites_ui_fix_overlay.b64'
      - '.github/workflows/build-v5131-favorites-ui-fix.yml'
  workflow_dispatch:

jobs:
  build-favorites-ui-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download verified Favorites baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v5131uifix /tmp/baseline
          mkdir -p /tmp/v5131uifix /tmp/baseline
          gh run download 34706151893 --repo "$GITHUB_REPOSITORY" --name V5.1.31-favorites-watchlist --dir /tmp/baseline
          unzip -q /tmp/baseline/V5.1.31-Kaynak-Kod.zip -d /tmp/v5131uifix

      - name: Apply Favorites and Opportunity responsive UI fixes
        run: |
          set -euo pipefail
          base64 -d build_payload/v5131_favorites_ui_fix_overlay.b64 > /tmp/ui-fix-overlay.tar.xz
          xz -t /tmp/ui-fix-overlay.tar.xz
          tar -xJf /tmp/ui-fix-overlay.tar.xz -C /tmp/v5131uifix

      - name: Verify requested wiring and responsive labels
        working-directory: /tmp/v5131uifix
        run: |
          set -euo pipefail
          grep -F 'versionName = "5.1.31"' app/build.gradle.kts
          grep -F 'versionCode = 81' app/build.gradle.kts
          grep -F 'android:id="@+id/tabFavorites"' app/src/main/res/layout/activity_favorites.xml
          grep -F 'android:id="@+id/tabBistList"' app/src/main/res/layout/activity_favorites.xml
          grep -F 'Manuel Takip Listesi' app/src/main/res/layout/activity_favorites.xml
          grep -F 'android:id="@+id/watchLast"' app/src/main/res/layout/item_bist_watchlist.xml
          grep -F 'holder.last.text' app/src/main/java/tr/borsatakip/v5/ui/BistWatchlistAdapter.kt
          grep -F 'findViewById<TextView>(R.id.btnRealOpportunityScan)' app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt
          grep -F 'Benchmark verisi yok' app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt
          grep -F 'FIRSATLARI YENİLE' app/src/main/res/layout/activity_opportunity.xml

      - name: Backend tests
        working-directory: /tmp/v5131uifix
        run: |
          set -euo pipefail
          python -m venv /tmp/v5131uifix-venv
          /tmp/v5131uifix-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5131uifix-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests
        working-directory: /tmp/v5131uifix
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"

      - name: Android lint
        working-directory: /tmp/v5131uifix
        run: |
          set -euo pipefail
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify V5.1.31 APK
        working-directory: /tmp/v5131uifix
        run: |
          set -euo pipefail
          gradle :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.31'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='81'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/V5.1.31.apk"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31.apk" > "$GITHUB_WORKSPACE/V5.1.31.apk.sha256"

      - name: Package matching source
        run: |
          set -euo pipefail
          cd /tmp/v5131uifix
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ .kotlin source_parts
          zip -qr "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" . -x '*.pyc' '*/__pycache__/*' 'source_parts/*'
          unzip -t "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip.sha256"

      - name: Upload APK and matching source
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.31-favorites-ui-fix
          path: |
            V5.1.31.apk
            V5.1.31.apk.sha256
            V5.1.31-Kaynak-Kod.zip
            V5.1.31-Kaynak-Kod.zip.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
          if-no-files-found: error
