name: Apply Technical Audit Fixes

on:
  push:
    branches: [ v5.1.27-completion ]
    paths:
      - '.github/workflows/apply-audit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v5.1.27-completion
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify staged patch chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          ba450d9a6a5f0fe04c1a5c158cc5620621088d9607ba2deda0aa964c6cbde1dd  ci/report-fixes/p00_0.txt
          39aa0b4a1d57da7f52c3dd021584d0416b2f1667ff60d2fc4f62fe34ac4816c6  ci/report-fixes/p00_1.txt
          b993005211d958e46ac134f84e9ee254550711ecdb920796a10d19f0bf382d8d  ci/report-fixes/p00_2.txt
          4c9762d1a802542ac5657326e32e9382de8c9769cb5344bdcd7857fe5d7c3acf  ci/report-fixes/p00_3.txt
          40b72076b86aa61032b0397f2ba4dcd950ac6fba6a2372c412909f012fea9020  ci/report-fixes/p01_0.txt
          cf07ffe1db2bb7c25e35cc6e32eee7095f218114564c18e04532165b4a24844a  ci/report-fixes/p01_1.txt
          f7546662551c85678d357ee4166e8febeed1dd71c2a62a617065280a0526742f  ci/report-fixes/p01_2.txt
          3911ec947debd12d4d6144f215fea6635ebb1999b53161cf12e88d641a8e1169  ci/report-fixes/p01_3.txt
          4679f3bc1ca86a9ebcd3b61456a719a875ca5564875ed3e529c436497b30d17e  ci/report-fixes/part02.txt
          4c3ca06688fd76b19b5c0451a44c46bbdff9ca1dd96bb61e5381200e0ff40b10  ci/report-fixes/part03.txt
          3e69f66befdb7e39feea46241ae3a0a2989098e2cd04d35bfe627a296d574793  ci/report-fixes/part04.txt
          982516a29049f812adb81098d09e1bb26b7f51c7a5e8371360059fb1cba9fa10  ci/report-fixes/part05.txt
          a7811b43930dd1aca348d27fd598a17894de5dcb02b057085d0ad2c1665aee12  ci/report-fixes/part06.txt
          EOF
          sha256sum -c /tmp/chunks.sha256

      - name: Reconstruct and apply audited source patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/report-fixes/p00_0.txt ci/report-fixes/p00_1.txt ci/report-fixes/p00_2.txt ci/report-fixes/p00_3.txt \
              ci/report-fixes/p01_0.txt ci/report-fixes/p01_1.txt ci/report-fixes/p01_2.txt ci/report-fixes/p01_3.txt \
              ci/report-fixes/part02.txt ci/report-fixes/part03.txt ci/report-fixes/part04.txt ci/report-fixes/part05.txt ci/report-fixes/part06.txt \
              | base64 -d | gzip -d > /tmp/audit-fixes.patch
          sha256sum /tmp/audit-fixes.patch
          git apply --check /tmp/audit-fixes.patch
          git apply /tmp/audit-fixes.patch

      - name: Generate verified Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Debug APK build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify debug APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/aapt-badging.txt
          grep -q "package: name='tr.borsatakip.v5'" /tmp/aapt-badging.txt
          grep -q "versionName='5.1.27'" /tmp/aapt-badging.txt

      - name: Release R8 smoke build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Backend tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
          python -m compileall -q backend/app
          pytest -q backend/tests

      - name: Backend Docker smoke build
        run: docker build -t borsatakip-backend-audit ./backend

      - name: Remove obsolete staging and legacy source debris
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/report-fixes
          rm -f BORSA-TAKIP-V5.0.0-KAYNAK-KOD.zip
          rm -f .github/workflows/apply-audit-fixes.yml

      - name: Commit verified audited source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply F01-F28 technical audit fixes'
          git push origin HEAD:v5.1.27-completion
          git rev-parse HEAD | tee /tmp/final-commit.txt

      - name: Package verified deliverables
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk BorsaTakipV5.1.27-Audit-Duzeltilmis-debug.apk
          git archive --format=zip --output=BorsaTakipV5.1.27-Audit-Duzeltilmis-Kaynak-Kod.zip HEAD
          sha256sum BorsaTakipV5.1.27-Audit-Duzeltilmis-debug.apk BorsaTakipV5.1.27-Audit-Duzeltilmis-Kaynak-Kod.zip | tee SHA256SUMS.txt
          cp /tmp/final-commit.txt FINAL_COMMIT.txt
          cp /tmp/aapt-badging.txt APK_METADATA.txt

      - name: Upload verified deliverables
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.27-Audit-Duzeltilmis-deliverables
          path: |
            BorsaTakipV5.1.27-Audit-Duzeltilmis-debug.apk
            BorsaTakipV5.1.27-Audit-Duzeltilmis-Kaynak-Kod.zip
            SHA256SUMS.txt
            FINAL_COMMIT.txt
            APK_METADATA.txt
          if-no-files-found: error
          retention-days: 90
