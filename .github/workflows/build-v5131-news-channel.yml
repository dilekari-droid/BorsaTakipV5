name: Build V5.1.31 News and Channel

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payloads/v5131_news_channel.patch.xz.b64'
      - '.github/workflows/build-v5131-news-channel.yml'
  workflow_dispatch:

jobs:
  build-news-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: build-v5.1.28-apk
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct V5.1.31 and apply news/channel changes
        run: |
          set -euo pipefail
          rm -rf /tmp/v5131news
          mkdir -p /tmp/v5131news
          cat build_payload/v5128_part*.b64 | tr -d '\n' | base64 -d > /tmp/v5128.tar.xz
          xz -t /tmp/v5128.tar.xz
          tar -xJf /tmp/v5128.tar.xz -C /tmp/v5131news
          git fetch origin main --depth=1
          git show origin/main:build_payload/v5129_ui.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5129.patch
          git show origin/main:build_payload/v5129_fix.b64 | tr -d '\n' | base64 -d > /tmp/v5129_fix.tar.xz
          cd /tmp/v5131news
          patch -p1 --batch --forward < /tmp/v5129.patch || true
          xz -t /tmp/v5129_fix.tar.xz
          tar -xJf /tmp/v5129_fix.tar.xz -C /tmp/v5131news
          cd "$GITHUB_WORKSPACE"
          for f in 00 01 02 03 04; do git show origin/main:build_payload/v5130_patch_part_${f}.b64; done | tr -d '\n' | base64 -d | xz -d > /tmp/v5130.patch
          git show origin/main:build_payload/v5130_backend.b64 | tr -d '\n' | base64 -d > /tmp/v5130_backend.tar.xz
          git show origin/main:build_payload/v5131_final_patch.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5131.patch
          git show origin/main:build_payload/v5132_chart_patch.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5132.patch
          git show origin/main:build_payloads/v5131_scan_results_fix.tar.xz.b64 | tr -d '\n' | base64 -d > /tmp/v5131_scan_results_fix.tar.xz
          git show origin/main:build_payloads/v5131_chart_visual_fix.tar.xz.b64 | tr -d '\n' | base64 -d > /tmp/v5131_chart_visual_fix.tar.xz
          git show origin/main:build_payloads/v5131_news_channel.patch.xz.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v5131_news_channel.patch
          cd /tmp/v5131news
          patch -p4 --batch --forward < /tmp/v5130.patch || true
          xz -t /tmp/v5130_backend.tar.xz
          tar -xJf /tmp/v5130_backend.tar.xz -C /tmp/v5131news
          patch -p4 --batch --forward < /tmp/v5131.patch
          rm -rf backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__
          patch -p1 --batch --forward < /tmp/v5132.patch || true
          xz -t /tmp/v5131_scan_results_fix.tar.xz
          tar -xJf /tmp/v5131_scan_results_fix.tar.xz -C /tmp/v5131news
          xz -t /tmp/v5131_chart_visual_fix.tar.xz
          tar -xJf /tmp/v5131_chart_visual_fix.tar.xz -C /tmp/v5131news
          patch -p4 --batch --forward < /tmp/v5131_news_channel.patch
          rm -rf source_parts backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ .kotlin

      - name: Verify requested wiring
        working-directory: /tmp/v5131news
        run: |
          set -euo pipefail
          grep -F 'versionName = "5.1.31"' app/build.gradle.kts
          grep -F 'versionCode = 81' app/build.gradle.kts
          test -f app/src/main/java/tr/borsatakip/v5/data/NewsRepository.kt
          grep -F 'Google Haberler RSS' app/src/main/java/tr/borsatakip/v5/data/NewsRepository.kt
          grep -F 'CACHE_TTL_MS' app/src/main/java/tr/borsatakip/v5/data/NewsRepository.kt
          grep -F 'TEKRAR DENE' app/src/main/res/layout/activity_news.xml
          grep -F 'showChannel' app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt
          grep -F 'onDoubleTap' app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt
          grep -F 'onLongPress' app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt
          grep -F 'drawDynamicChannel' app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt
          grep -F 'drawSelection' app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt
          test -f app/src/main/java/tr/borsatakip/v5/ui/FullscreenChartActivity.kt

      - name: Backend tests
        working-directory: /tmp/v5131news
        run: |
          set -euo pipefail
          python -m venv /tmp/v5131news-venv
          /tmp/v5131news-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5131news-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests
        working-directory: /tmp/v5131news
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"

      - name: Android lint
        working-directory: /tmp/v5131news
        run: |
          set -euo pipefail
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify V5.1.31 debug APK
        working-directory: /tmp/v5131news
        run: |
          set -euo pipefail
          gradle :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.31'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='81'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/V5.1.31.apk"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31.apk" > "$GITHUB_WORKSPACE/V5.1.31.apk.sha256"

      - name: Package matching V5.1.31 source
        run: |
          set -euo pipefail
          cd /tmp/v5131news
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ source_parts .kotlin
          zip -qr "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" . -x '*.pyc' '*/__pycache__/*' 'source_parts/*'
          unzip -t "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip.sha256"

      - name: Upload APK and matching source
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.31-news-channel
          path: |
            V5.1.31.apk
            V5.1.31.apk.sha256
            V5.1.31-Kaynak-Kod.zip
            V5.1.31-Kaynak-Kod.zip.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
          if-no-files-found: error
