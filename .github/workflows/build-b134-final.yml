name: B134 Final Validation
on:
  push:
    branches: [v525-b134-settings-control-center]
    paths: ['.github/workflows/build-b134-final.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore B133 and apply B134
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/base /tmp/out /tmp/b133; mkdir -p /tmp/src /tmp/base /tmp/out /tmp/b133
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10538687420/zip" -o /tmp/b133.zip
          unzip -q /tmp/b133.zip -d /tmp/b133
          SRCZIP=$(find /tmp/b133 -type f -name '*B133*Kaynak-Kod.zip' | head -n1); test -s "$SRCZIP"
          echo '30d235a41693fdaf1ef03901823e424b5aa5d7af2620b0af90168724bfdfb581  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src; cp -a /tmp/src/. /tmp/base/
          cat "$GITHUB_WORKSPACE"/ci_payload/b134/part* > /tmp/b134.b64
          echo 'f8db2d8a1f58fd07b3376102473f73bbcfaee332fac9ef65633fc6b2c74e06f9  /tmp/b134.b64' | sha256sum -c -
          base64 -d /tmp/b134.b64 > /tmp/b134.gz; echo 'c698b57aaf00dea10c0b71ddba54238f167fc052f859112050fe7df07c668f76  /tmp/b134.gz' | sha256sum -c -
          gzip -dc /tmp/b134.gz > /tmp/b134.patch; echo '4446d1083a529fd416b8abcb66857a97ad17835307725b5c96698b47899166d8  /tmp/b134.patch' | sha256sum -c -
          cd /tmp/src; git init -q; git add .; git -c user.email=ci@example.invalid -c user.name=CI commit -qm baseline; git apply --check /tmp/b134.patch; git apply /tmp/b134.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/app/src/test/java/tr/borsatakip/v5/data/B134SettingsControlCenterSourceTest.kt'); lines=p.read_text().splitlines(); out=[]; fixed=False
          for line in lines:
              if 'assertFalse(details.contains' in line and 'settingsStore.apiKey' in line and 'InputType.TYPE_CLASS_TEXT' in line:
                  out.append('        assertFalse(details.contains("InputType.TYPE_TEXT_VARIATION_PASSWORD, settingsStore.apiKey"))'); fixed=True
              else: out.append(line)
          if not fixed: raise SystemExit('TEST_SYNTAX_FIX_TARGET_NOT_FOUND')
          p.write_text('\n'.join(out)+'\n')
          PY
          mkdir -p /tmp/src/.github/workflows; cp "$GITHUB_WORKSPACE/.github/workflows/build-b134-final.yml" /tmp/src/.github/workflows/
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts; grep -F 'versionCode = 134' /tmp/src/app/build.gradle.kts; grep -F 'versionName = "5.2.5"' /tmp/src/app/build.gradle.kts
      - name: Static scope integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,xml.etree.ElementTree as ET
          a0=Path('/tmp/base'); b0=Path('/tmp/src'); ex={'.git','.gradle','.kotlin','build'}
          def hs(root):
              d={}
              for p in root.rglob('*'):
                  if p.is_file():
                      r=p.relative_to(root)
                      if not any(x in ex for x in r.parts): d[r.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return d
          a=hs(a0); b=hs(b0); changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k)); print('\n'.join(changed))
          allowed={'.github/workflows/build-b134-final.yml','B134_CHANGES.md','B134_SETTINGS_INVENTORY.md','SETTINGS_FUNCTION_MATRIX.md','app/build.gradle.kts','app/src/main/AndroidManifest.xml','app/src/main/java/tr/borsatakip/v5/analysis/TradeForwardEngine.kt','app/src/main/java/tr/borsatakip/v5/data/AlertEventStore.kt','app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt','app/src/main/java/tr/borsatakip/v5/ui/SettingsActivity.kt','app/src/main/java/tr/borsatakip/v5/ui/SettingsDetailActivity.kt','app/src/main/java/tr/borsatakip/v5/ui/SettingsSearchActivity.kt','app/src/main/java/tr/borsatakip/v5/worker/RealtimeAlertService.kt','app/src/main/res/layout/activity_settings.xml','app/src/main/res/layout/activity_settings_detail.xml','app/src/main/res/layout/activity_settings_search.xml','app/src/test/java/tr/borsatakip/v5/analysis/TradeSimulationEstimateTest.kt','app/src/test/java/tr/borsatakip/v5/data/B117EngineIntegritySourceTest.kt','app/src/test/java/tr/borsatakip/v5/data/B134SettingsControlCenterSourceTest.kt'}
          if set(changed)!=allowed: raise SystemExit('SCOPE_MISMATCH')
          for p in list((b0/'app/src/main/res').rglob('*.xml'))+[b0/'app/src/main/AndroidManifest.xml']: ET.parse(p)
          for r in ['app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt','app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt','app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt','app/src/main/java/tr/borsatakip/v5/data/ViopRepository.kt','app/src/main/java/tr/borsatakip/v5/data/ViopContractSelector.kt']:
              if a.get(r)!=b.get(r): raise SystemExit('VIOP_CHANGED='+r)
          d=(b0/'app/src/main/java/tr/borsatakip/v5/ui/SettingsDetailActivity.kt').read_text(); s=(b0/'app/src/main/java/tr/borsatakip/v5/ui/SettingsActivity.kt').read_text()
          for n,ok in [('key_not_loaded','setText(settingsStore.apiKey)' not in d),('https_validation','ProviderReadinessService.isValidHttps(typed)' in d),('simulation','TradeForwardEngine.estimateRoundTrip' in d),('history','AlertEventStore(this)' in d),('viop_return','EXTRA_RETURN_TO_VIOP' in s),('autotest','autoTestAfterSave()' in s)]:
              if not ok: raise SystemExit(n+'_FAIL')
          print('STATIC_SCOPE=PASS XML=PASS VIOP_PRESERVATION=PASS')
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Unit lint build
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail; chmod +x gradlew
          D=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' '); export D; echo "UNIT_TEST_DISCOVERED=$D" | tee /tmp/test-summary.txt
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
          python3 - <<'PY'
          import glob,os,xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          d=int(os.environ['D']); line=f'UNIT_TEST_EXECUTED={t} UNIT_TEST_PASSED={t-f-e-s} UNIT_TEST_FAILURES={f} UNIT_TEST_ERRORS={e} UNIT_TEST_SKIPPED={s}'; print(line); open('/tmp/test-summary.txt','a').write(line+'\nLINT_DEBUG=PASS\nASSEMBLE_DEBUG=PASS\n')
          if t!=d or f or e or s: raise SystemExit(line)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Emulator instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            /tmp/src/gradlew -p /tmp/src --no-daemon connectedDebugAndroidTest --stacktrace
            mkdir -p /tmp/out/visual-screenshots
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/visual-screenshots/. /tmp/out/visual-screenshots/ || true
      - name: Instrumentation count
        shell: bash
        run: |
          set -euo pipefail
          D=$(grep -Rho '@Test' /tmp/src/app/src/androidTest --include='*.kt' | wc -l | tr -d ' '); E=$(grep -Rho '<testcase ' /tmp/src/app/build/outputs/androidTest-results/connected 2>/dev/null | wc -l | tr -d ' ')
          echo "INSTRUMENTATION_TEST_DISCOVERED=$D" | tee -a /tmp/test-summary.txt; echo "INSTRUMENTATION_TEST_EXECUTED=$E" | tee -a /tmp/test-summary.txt; test "$E" -ge "$D"; echo 'INSTRUMENTATION_TESTS=PASS' >> /tmp/test-summary.txt
      - name: Verify APK and export
        shell: bash
        run: |
          set -euo pipefail; APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk; test -s "$APK"; unzip -t "$APK" | tee /tmp/out/APK-ZIP-TEST.txt
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1); AAPT="$ANDROID_HOME/build-tools/$BT/aapt"; S="$ANDROID_HOME/build-tools/$BT/apksigner"; Z="$ANDROID_HOME/build-tools/$BT/zipalign"
          B=$($AAPT dump badging "$APK" | head -n1); echo "$B" | tee /tmp/out/BADGING.txt; echo "$B" | grep -F "name='tr.borsatakip.v5'"; echo "$B" | grep -F "versionCode='134'"; echo "$B" | grep -F "versionName='5.2.5'"
          $S verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt; $S verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'; $Z -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B134-SETTINGS-CONTROL-CENTER-debug.apk; cp "$APK" "$OUT"; sha256sum "$OUT" | tee "$OUT.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src'); out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B134-SETTINGS-CONTROL-CENTER-Kaynak-Kod.zip'); ex={'.git','.gradle','.kotlin','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(x in ex for x in p.relative_to(src).parts): z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B134-SETTINGS-CONTROL-CENTER-Kaynak-Kod.zip | tee /tmp/out/V5-ARACI-KURUM-5.2.5-B134-SETTINGS-CONTROL-CENTER-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt; cp /tmp/src/{B134_CHANGES.md,B134_SETTINGS_INVENTORY.md,SETTINGS_FUNCTION_MATRIX.md} /tmp/out/
          { echo 'B134 SETTINGS CONTROL CENTER'; echo 'applicationId=tr.borsatakip.v5'; echo 'versionCode=134'; echo 'versionName=5.2.5'; cat /tmp/test-summary.txt; echo 'apk_zip_integrity=PASS'; echo 'aapt_badging=PASS'; echo 'apksigner_v2=PASS'; echo 'zipalign=PASS'; echo 'emulator_instrumentation=PASS'; echo 'physical_device_test=NOT_RUN'; echo 'network_negative_matrix=NOT_FULLY_AUTOMATED'; echo 'signing=DEBUG'; echo "source_commit=$GITHUB_SHA"; } > /tmp/out/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: B134-SETTINGS-CONTROL-CENTER-FINAL
          path: /tmp/out/*
          retention-days: 90
