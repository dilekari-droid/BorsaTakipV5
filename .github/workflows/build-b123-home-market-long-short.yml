name: B123 Home Market LONG SHORT
on:
  push:
    branches: [v525-b123-home-market-long-short]
    paths:
      - '.github/workflows/build-b123-home-market-long-short.yml'
      - 'ci_payload/b123_home_market_long_short/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified B122 source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b122 && mkdir -p /tmp/src /tmp/out /tmp/b122
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10460894318/zip" -o /tmp/b122-artifact.zip
          unzip -q /tmp/b122-artifact.zip -d /tmp/b122
          SRCZIP=$(find /tmp/b122 -type f -name '*B122*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo 'e7b6a4941ac88a5dfc140af4e7111389302a0a0313c5954c1ad39651d0656393  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'versionCode = 122' /tmp/src/app/build.gradle.kts
      - name: Apply B123 home market LONG SHORT patch
        shell: bash
        run: |
          set -euo pipefail
          cp ci_payload/b123_home_market_long_short/b123.patch /tmp/b123.patch
          echo '46af4262a8530fcef706affc2821ff1686563080e8841b98812bd226e7375863  /tmp/b123.patch' | sha256sum -c -
          cd /tmp/src
          git apply --check /tmp/b123.patch
          git apply /tmp/b123.patch
          grep -F 'versionCode = 123' app/build.gradle.kts
          grep -F 'todayLongTab' app/src/main/res/layout/activity_main.xml
          grep -F 'todayShortTab' app/src/main/res/layout/activity_main.xml
          grep -F 'MarketInstrumentDetailActivity' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          grep -F 'listOf("XU030.IS", "^XU030", "XU030")' app/src/main/java/tr/borsatakip/v5/ui/MarketInstrumentDetailActivity.kt
          cp /tmp/b123.patch /tmp/out/B123-HOME-MARKET-LONG-SHORT.patch
          sha256sum /tmp/b123.patch > /tmp/out/B123-HOME-MARKET-LONG-SHORT.patch.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Discover and require all Android unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY' | tee -a /tmp/test-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          d=int(os.environ['DISCOVERED']); t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          passed=t-f-e-s
          print(f'TEST_EXECUTED={t} TEST_PASSED={passed} TEST_FAILURES={f} TEST_ERRORS={e} TEST_SKIPPED={s}')
          if t != d or f or e or s: raise SystemExit(f'Test contract failed: discovered={d}, executed={t}, failures={f}, errors={e}, skipped={s}')
          PY
      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and export B123
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"; echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"; echo "$BADGING" | grep -F "versionCode='123'"; echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B123-HOME-MARKET-LONG-SHORT-debug.apk
          cp "$APK" "$OUT"; sha256sum "$OUT" | tee "$OUT.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src'); out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B123-HOME-MARKET-LONG-SHORT-Kaynak-Kod.zip'); excluded={'.git','.gradle','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(x in excluded for x in p.relative_to(src).parts): z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B123-HOME-MARKET-LONG-SHORT-Kaynak-Kod.zip > /tmp/out/V5-ARACI-KURUM-5.2.5-B123-HOME-MARKET-LONG-SHORT-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          {
            echo 'B123 HOME MARKET LONG SHORT VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'; echo 'versionCode=123'; echo 'versionName=5.2.5'
            echo 'b123_patch_sha256=46af4262a8530fcef706affc2821ff1686563080e8841b98812bd226e7375863'
            echo 'home_long_short_tabs=YES'
            echo 'market_tiles_clickable=BIST100,BIST30,USDTRY,XAUUSD,VIOP30'
            echo 'bist30_multi_symbol_fallback=XU030.IS,^XU030,XU030'
            echo 'market_value_autosize_min=6sp'
            echo 'existing_scan_engines=UNCHANGED'
            cat /tmp/test-summary.txt
            echo 'production_live_e2e=NOT_RUN'; echo 'physical_device_test=NOT_RUN'; echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: B123-HOME-MARKET-LONG-SHORT
          path: /tmp/out/*
          retention-days: 90
