name: Build B113 Fixed Verified APK

on:
  push:
    branches:
      - v525-b113-verified-apk
    paths:
      - ".github/workflows/build-b113-verified.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact B113 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b113-src
          cat ci_payload/v525_b113_android_exact/part-*.b64 > /tmp/b113_android_exact.b64
          base64 --decode /tmp/b113_android_exact.b64 > /tmp/b113_android_exact.tar.xz
          echo "7046afbb99b19c2b7e682c9aceee87f3c73260027b687f97ca941ceea6a2a93e  /tmp/b113_android_exact.tar.xz" | sha256sum -c -
          tar -xJf /tmp/b113_android_exact.tar.xz -C /tmp/b113-src

      - name: Apply reviewed B113 test fixes
        shell: bash
        run: |
          set -euo pipefail
          echo "83b11f91b979b6752d10e464f245062109f49466eaab50a2c5a74caccb9ca95a  ci_payload/b113_fixes/b113_140_tests.patch" | sha256sum -c -
          cd /tmp/b113-src
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"

      - name: Verify source identity and version hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/b113-src/app/build.gradle.kts
          grep -F 'versionCode = 113' /tmp/b113-src/app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' /tmp/b113-src/app/build.gradle.kts
          if grep -R -n -E '["'"']\s*V?5\.1\.[0-9]+[^"'"']*["'"']' /tmp/b113-src/app/src/main --include='*.kt' --include='*.java' --include='*.xml'; then
            echo "Hardcoded legacy 5.1.x version literal found" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run all unit tests
        working-directory: /tmp/b113-src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Verify 140 of 140 tests passed
        working-directory: /tmp/b113-src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          files = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          if not files:
              raise SystemExit('No JUnit XML results found')
          for f in files:
              root = ET.parse(f).getroot()
              total += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'TEST_TOTAL={total}')
          print(f'TEST_FAILURES={failures}')
          print(f'TEST_ERRORS={errors}')
          print(f'TEST_SKIPPED={skipped}')
          if total != 140 or failures != 0 or errors != 0:
              raise SystemExit(f'Expected 140/140 passing tests, got total={total}, failures={failures}, errors={errors}')
          PY

      - name: Build debug APK
        working-directory: /tmp/b113-src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK package, version, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/b113-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='113'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/zipalign.txt

          mkdir -p /tmp/b113-output
          OUT=/tmp/b113-output/V5-ARACI-KURUM-5.2.5-B113-TARAMA-ZAMANI-FIXED-debug.apk
          cp "$APK" "$OUT"
          APK_SHA="$(sha256sum "$OUT" | awk '{print $1}')"

          {
            echo "B113 FIXED VERIFIED BUILD"
            echo "repository=dilekari-droid/BorsaTakipV5"
            echo "branch=v525-b113-verified-apk"
            echo "git_commit=$GITHUB_SHA"
            echo "original_source_zip_sha256=ebcf0eb32d5ba8e5968647e9e956be40e49765caeecaeb3d466f3235e897e46e"
            echo "original_android_source_archive_sha256=7046afbb99b19c2b7e682c9aceee87f3c73260027b687f97ca941ceea6a2a93e"
            echo "fix_patch_sha256=83b11f91b979b6752d10e464f245062109f49466eaab50a2c5a74caccb9ca95a"
            echo "applicationId=tr.borsatakip.v5"
            echo "versionCode=113"
            echo "versionName=5.2.5"
            echo "unit_tests=140/140 passed"
            echo "apk_sha256=$APK_SHA"
            echo "apk_file=$(basename "$OUT")"
          } | tee /tmp/b113-output/B113_FIXED_BUILD_PROVENANCE.txt
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload fixed verified B113 APK
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.2.5-B113-TARAMA-ZAMANI-FIXED-APK
          path: |
            /tmp/b113-output/V5-ARACI-KURUM-5.2.5-B113-TARAMA-ZAMANI-FIXED-debug.apk
            /tmp/b113-output/V5-ARACI-KURUM-5.2.5-B113-TARAMA-ZAMANI-FIXED-debug.apk.sha256
            /tmp/b113-output/B113_FIXED_BUILD_PROVENANCE.txt
            /tmp/b113-src/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 90
