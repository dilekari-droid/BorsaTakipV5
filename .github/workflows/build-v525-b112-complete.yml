name: Build V5.2.5 B112 Complete

on:
  push:
    branches: [ v525-b112-complete-build ]
    paths:
      - '.github/workflows/build-v525-b112-complete.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct exact B112 source
        run: |
          set -euo pipefail
          cat ci_payload/v525_b112_exact/part-* | base64 -d > /tmp/b112.tar.xz
          echo "4303b11735da4fca0836877e52b2124165bf7f7337d3bba492e720426a00a3c9  /tmp/b112.tar.xz" | sha256sum -c -
          mkdir -p /tmp/v525b112
          tar -xJf /tmp/b112.tar.xz -C /tmp/v525b112

      - name: Verify source version
        run: |
          set -euo pipefail
          grep -F 'versionCode = 112' /tmp/v525b112/app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' /tmp/v525b112/app/build.gradle.kts

      - name: Unit tests
        run: gradle -p /tmp/v525b112 :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p /tmp/v525b112 :app:assembleDebug --stacktrace

      - name: Verify APK identity and integrity
        run: |
          set -euo pipefail
          APK=/tmp/v525b112/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 1 /tmp/apk-unzip-test.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          grep -F "versionCode='112'" /tmp/badging.txt
          grep -F "versionName='5.2.5'" /tmp/badging.txt
          mkdir -p artifacts
          cp "$APK" artifacts/V5-ARACI-KURUM-5.2.5-B112-COMPLETE-REALTIME-debug.apk
          sha256sum artifacts/V5-ARACI-KURUM-5.2.5-B112-COMPLETE-REALTIME-debug.apk | tee artifacts/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.2.5-B112-APK
          path: |
            artifacts/V5-ARACI-KURUM-5.2.5-B112-COMPLETE-REALTIME-debug.apk
            artifacts/SHA256.txt
          if-no-files-found: error
