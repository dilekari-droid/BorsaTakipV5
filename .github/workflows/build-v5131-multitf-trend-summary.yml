name: Build V5.1.31 MultiTF Trend Summary

on:
  push:
    branches: [ main ]
    paths:
      - 'build_payload/v5131_multitf_trend_overlay.b64'
      - '.github/workflows/build-v5131-multitf-trend-summary.yml'
  workflow_dispatch:

jobs:
  build-multitf-trend-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download verified V5.1.31 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v5131trend /tmp/baseline
          mkdir -p /tmp/v5131trend /tmp/baseline
          gh run download 34701695324 --repo "$GITHUB_REPOSITORY" --name V5.1.31-opportunity-control --dir /tmp/baseline
          unzip -q /tmp/baseline/V5.1.31-Kaynak-Kod.zip -d /tmp/v5131trend

      - name: Apply MultiTF trend summary overlay
        run: |
          set -euo pipefail
          base64 -d build_payload/v5131_multitf_trend_overlay.b64 > /tmp/multitf-overlay.tar.xz
          tar -xJf /tmp/multitf-overlay.tar.xz -C /tmp/v5131trend

      - name: Verify wiring and version
        working-directory: /tmp/v5131trend
        run: |
          set -euo pipefail
          grep -F 'versionName = "5.1.31"' app/build.gradle.kts
          grep -F 'versionCode = 81' app/build.gradle.kts
          grep -F 'ÇOKLU ZAMAN DİLİMİ TREND ÖZETİ' app/src/main/res/layout/activity_technical_analysis.xml
          grep -F 'RENK VE İFADE AÇIKLAMALARI' app/src/main/res/layout/activity_technical_analysis.xml
          grep -F 'trendRow3m' app/src/main/res/layout/activity_technical_analysis.xml
          grep -F 'TrendDirection.UP -> "↗"' app/src/main/java/tr/borsatakip/v5/ui/TechnicalAnalysisActivity.kt
          grep -F 'TrendDirection.DOWN -> "↘"' app/src/main/java/tr/borsatakip/v5/ui/TechnicalAnalysisActivity.kt

      - name: Backend tests
        working-directory: /tmp/v5131trend
        run: |
          set -euo pipefail
          python -m venv /tmp/v5131trend-venv
          /tmp/v5131trend-venv/bin/pip install -r backend/requirements.txt pytest
          /tmp/v5131trend-venv/bin/pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.txt"

      - name: Android unit tests
        working-directory: /tmp/v5131trend
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"

      - name: Android lint
        working-directory: /tmp/v5131trend
        run: |
          set -euo pipefail
          gradle :app:lintDebug | tee "$GITHUB_WORKSPACE/android-lint.txt"

      - name: Assemble and verify V5.1.31 APK
        working-directory: /tmp/v5131trend
        run: |
          set -euo pipefail
          gradle :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='5.1.31'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionCode='81'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/V5.1.31.apk"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31.apk" > "$GITHUB_WORKSPACE/V5.1.31.apk.sha256"

      - name: Package matching source
        run: |
          set -euo pipefail
          cd /tmp/v5131trend
          rm -rf app/build .gradle backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__ .kotlin
          zip -qr "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" . -x '*.pyc' '*/__pycache__/*'
          unzip -t "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/source-zip-test.txt"
          sha256sum "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip" > "$GITHUB_WORKSPACE/V5.1.31-Kaynak-Kod.zip.sha256"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.31-multitf-trend-summary
          path: |
            V5.1.31.apk
            V5.1.31.apk.sha256
            V5.1.31-Kaynak-Kod.zip
            V5.1.31-Kaynak-Kod.zip.sha256
            backend-tests.txt
            android-unit-tests.txt
            android-lint.txt
            apk-badging.txt
            apk-unzip-test.txt
            source-zip-test.txt
          if-no-files-found: error
