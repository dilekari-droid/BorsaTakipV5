name: B127 Compile Diagnostics

on:
  push:
    branches: [v525-b127-merged-integrity-fix]
    paths: ['.github/workflows/diag-b127-hotfix.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/b126 && mkdir -p /tmp/src /tmp/b126
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10497732204/zip" -o /tmp/b126-artifact.zip
          unzip -q /tmp/b126-artifact.zip -d /tmp/b126
          SRCZIP=$(find /tmp/b126 -type f -name '*B126*Kaynak-Kod.zip' | head -n1)
          unzip -q "$SRCZIP" -d /tmp/src
          cat "$GITHUB_WORKSPACE"/ci_payload/b127_merged_integrity/chunks/part_* > /tmp/base.b64
          base64 -d /tmp/base.b64 | gzip -dc > /tmp/base.patch
          (cd /tmp/src && patch -p1 --batch --forward < /tmp/base.patch)
          cat "$GITHUB_WORKSPACE"/ci_payload/b127_hotfix/chunks/part_* > /tmp/hotfix.b64
          base64 -d /tmp/hotfix.b64 | gzip -dc > /tmp/hotfix.patch
          (cd /tmp/src && patch -p1 --batch --forward < /tmp/hotfix.patch)
      - name: Print MTF compile targets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/src
          echo '=== MtfHistoryCache ==='
          nl -ba app/src/main/java/tr/borsatakip/v5/data/MtfHistoryCache.kt
          echo '=== B119StabilityPerformanceTest 90-135 ==='
          nl -ba app/src/test/java/tr/borsatakip/v5/analysis/B119StabilityPerformanceTest.kt | sed -n '90,135p'
