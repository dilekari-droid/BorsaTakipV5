name: V5.2.5 Color Fix Build

on:
  workflow_dispatch:
  push:
    branches: [ v525-color-payload ]
    paths:
      - '.github/workflows/build-v525-color-fix.yml'
      - 'build_payload/v525_colorfix_*.b64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify V5.2.5 source
        shell: bash
        run: |
          set -euo pipefail
          ls -l build_payload/v525_colorfix_*.b64
          cat build_payload/v525_colorfix_*.b64 > /tmp/v525.b64
          base64 --decode /tmp/v525.b64 > /tmp/v525.tar.xz
          xz -t /tmp/v525.tar.xz
          echo 'Archive integrity OK'
          echo 'Archive entries:'
          tar -tJf /tmp/v525.tar.xz | head -80
          rm -rf app
          tar -xJf /tmp/v525.tar.xz
          test -f app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' app/build.gradle.kts
          grep -F 'versionCode = 110' app/build.gradle.kts
          grep -F 'changePct > 0.0 -> R.color.green' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -F 'changePct < 0.0 -> R.color.red' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -F '▲' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -F '▼' app/src/main/java/tr/borsatakip/v5/ui/OpportunityAdapter.kt
          grep -F 'priceMovement' app/src/main/res/layout/item_opportunity.xml

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-test.txt
          tail -1 /tmp/apk-test.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "versionName='5.2.5'" /tmp/badging.txt
          mkdir -p app/build/outputs/final
          cp "$APK" app/build/outputs/final/V5-ARACI-KURUM-5.2.5-REALTIME-MARKET-ENGINE-COLOR-FIX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V5-ARACI-KURUM-5.2.5-COLOR-FIX
          path: app/build/outputs/final/*.apk
          if-no-files-found: error
