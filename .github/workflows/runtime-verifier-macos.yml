name: Android Runtime Verifier

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  runtime-verifier:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Emulator runtime verifier regression
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: gradle :app:connectedDebugAndroidTest --stacktrace
