name: B131 VIOP Main UI Redesign

on:
  push:
    branches: [v525-b131-viop-main-ui-redesign]
    paths:
      - '.github/workflows/build-b131-viop-main.yml'
      - 'ci_payload/b131_viop_main/B131-VIOP-MAIN-UI-REDESIGN.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified B130 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b130
          mkdir -p /tmp/src /tmp/out /tmp/b130
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10518483328/zip" \
            -o /tmp/b130-artifact.zip
          unzip -q /tmp/b130-artifact.zip -d /tmp/b130
          SRCZIP=$(find /tmp/b130 -type f -name '*B130*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo '0b79dbf250110f06ff3557e4c287ecdc130ca3562f45ed34d09b81ef614ff5f2  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts
          grep -F 'versionCode = 130' /tmp/src/app/build.gradle.kts

      - name: Apply B131 visible-main-screen patch
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$GITHUB_WORKSPACE/ci_payload/b131_viop_main/B131-VIOP-MAIN-UI-REDESIGN.patch.gz.b64"
          base64 -d "$PAYLOAD" > /tmp/B131.patch.gz
          gzip -t /tmp/B131.patch.gz
          gzip -dc /tmp/B131.patch.gz > /tmp/B131.patch
          echo 'ff2b77ff94c6cd03a150b27a7491dde7ef9c1c4b5bfc6f67b60bd79da54e7b89  /tmp/B131.patch' | sha256sum -c -
          ! grep -E '^diff .*app/src/main/java/tr/borsatakip/v5/(data|analysis)/' /tmp/B131.patch
          patch -p1 --batch --forward < /tmp/B131.patch
          grep -F 'versionCode = 131' app/build.gradle.kts
          grep -F 'RecyclerView.VERTICAL' app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          grep -F '@+id/summaryLong' app/src/main/res/layout/activity_viop.xml
          grep -F '@+id/viopSearch' app/src/main/res/layout/activity_viop.xml
          grep -F 'holder.price.text = "VİOP —"' app/src/main/java/tr/borsatakip/v5/ui/ViopUnderlyingOpportunityAdapter.kt
          cp /tmp/B131.patch /tmp/out/B131-VIOP-MAIN-UI-REDESIGN.patch
          sha256sum /tmp/B131.patch > /tmp/out/B131-VIOP-MAIN-UI-REDESIGN.patch.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run all unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          discovered=int(os.environ['DISCOVERED'])
          tests=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
              skipped += int(root.attrib.get('skipped',0))
          passed=tests-failures-errors-skipped
          line=f'TEST_EXECUTED={tests} TEST_PASSED={passed} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}'
          print(line)
          with open('/tmp/test-summary.txt','a',encoding='utf-8') as f: f.write(line+'\n')
          if tests != discovered or failures or errors or skipped:
              raise SystemExit(line)
          PY

      - name: Lint debug
        working-directory: /tmp/src
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Assemble debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify and export B131
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='131'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt

          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B131-VIOP-MAIN-UI-REDESIGN-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src')
          out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B131-VIOP-MAIN-UI-REDESIGN-Kaynak-Kod.zip')
          excluded={'.git','.gradle','.kotlin','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(part in excluded for part in p.relative_to(src).parts):
                      z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B131-VIOP-MAIN-UI-REDESIGN-Kaynak-Kod.zip | tee /tmp/out/V5-ARACI-KURUM-5.2.5-B131-VIOP-MAIN-UI-REDESIGN-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          cp /tmp/src/B131_CHANGES.md /tmp/out/B131_CHANGES.md
          {
            echo 'B131 VIOP MAIN UI REDESIGN'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=131'
            echo 'versionName=5.2.5'
            echo 'base=B130-VIOP-CONTRACT-DETAIL-UI'
            echo 'viop_main_screen_visual_redesign=ENABLED'
            echo 'viop_detail_b130=UNCHANGED'
            echo 'runtime_data_analysis_architecture=UNCHANGED'
            echo 'list_orientation=VERTICAL'
            echo 'search_and_category_filter=ENABLED'
            echo 'underlying_price_as_viop_price=FORBIDDEN'
            echo 'delayed_label_localized=GECIKMELI'
            cat /tmp/test-summary.txt
            echo 'physical_device_test=NOT_RUN'
            echo 'instrumentation_test=NOT_RUN_NO_DEVICE'
            echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B131-VIOP-MAIN-UI-REDESIGN-FINAL
          path: /tmp/out/*
          retention-days: 90
