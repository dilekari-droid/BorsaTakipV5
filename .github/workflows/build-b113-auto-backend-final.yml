name: Final B113 Production Readiness APK
on:
  push:
    branches: [v525-b113-verified-apk]
    paths:
      - '.github/workflows/build-b113-auto-backend-final.yml'
      - 'ci_payload/b113_fixes/auto_backend_scan/**'
      - 'ci_payload/b113_fixes/production_readiness/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src && mkdir -p /tmp/src
          cat ci_payload/v525_b113_android_exact/part-*.b64 | base64 --decode > /tmp/src.tar.xz
          echo '7046afbb99b19c2b7e682c9aceee87f3c73260027b687f97ca941ceea6a2a93e  /tmp/src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/src.tar.xz -C /tmp/src
          cd /tmp/src

          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_140_tests.patch"
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_crash_fix.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_crash_fix.patch"
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_regression_test.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_fgs_regression_test.patch"

          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/b113_b114_acceptance_fix.part-*.b64 | base64 --decode > /tmp/accept.gz
          gzip -dc /tmp/accept.gz > /tmp/accept.patch
          echo '3f66ad69afab268e397856741af19a1505b966b6740cd083b2d23c7f00bb68c6  /tmp/accept.patch' | sha256sum -c -
          git apply --check --exclude='backend/**' /tmp/accept.patch
          git apply --exclude='backend/**' /tmp/accept.patch
          mkdir -p app/src/test/java/tr/borsatakip/v5/data
          cp "$GITHUB_WORKSPACE/ci_payload/b113_fixes/broad_tests/B113B114AcceptanceSourceTest.kt" app/src/test/java/tr/borsatakip/v5/data/B113B114AcceptanceSourceTest.kt

          echo '9b2358c6db6b2dbfe9dc02133f7e2a3c465a5fc8461974f1fc91efb07fa4a61b  '"$GITHUB_WORKSPACE"'/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch' | sha256sum -c -
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_tradingview_chart_button_v2.patch"

          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/dual_scan/part-*.b64 | base64 --decode > /tmp/dual_scan.patch.gz
          echo '313892bf0d16aa6cdd4dca2b979ddf18216a14133713dd7289cada64362d4a91  /tmp/dual_scan.patch.gz' | sha256sum -c -
          gzip -dc /tmp/dual_scan.patch.gz > /tmp/dual_scan.patch
          echo 'e4e549dc52fa0585937a4cbbe1efa2a37a2f28221fc745c3eb13526b2200b3ac  /tmp/dual_scan.patch' | sha256sum -c -
          git apply --check /tmp/dual_scan.patch
          git apply /tmp/dual_scan.patch

          echo 'f11d62235a6d6561c220f434500739517f9457dcf23508619132d1bc7f5f50e7  '"$GITHUB_WORKSPACE"'/ci_payload/b113_fixes/b113_dual_scan_universe_acceptance_fix.patch' | sha256sum -c -
          git apply --check "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_dual_scan_universe_acceptance_fix.patch"
          git apply "$GITHUB_WORKSPACE/ci_payload/b113_fixes/b113_dual_scan_universe_acceptance_fix.patch"

          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/auto_backend_scan/part-*.b64 | base64 --decode > /tmp/auto_backend.patch.gz
          echo 'fc71cad2116ba1d6d2be6750081346c5ea767f4ef0c39e117bff960604ea1f75  /tmp/auto_backend.patch.gz' | sha256sum -c -
          gzip -dc /tmp/auto_backend.patch.gz > /tmp/auto_backend.patch
          echo 'f78fe202351193c36e2bd75aa8179ff6137d511d932fa44d963d8dc1f1d5fb0b  /tmp/auto_backend.patch' | sha256sum -c -
          git apply --check /tmp/auto_backend.patch
          git apply /tmp/auto_backend.patch

          cat "$GITHUB_WORKSPACE"/ci_payload/b113_fixes/auto_backend_scan/missing-*.b64 | base64 --decode > /tmp/auto_missing.patch.gz
          echo 'acb71ed4477bda485eeeb1ae14013ee4831fd933fdfb9801c96593dd471f9e49  /tmp/auto_missing.patch.gz' | sha256sum -c -
          gzip -dc /tmp/auto_missing.patch.gz > /tmp/auto_missing.patch
          echo 'c190f78af188e0eb06712ef9f86cf98ee881a877b865ddf3fc13c60cf191b894  /tmp/auto_missing.patch' | sha256sum -c -
          git apply --check /tmp/auto_missing.patch
          git apply /tmp/auto_missing.patch

          base64 --decode "$GITHUB_WORKSPACE/ci_payload/b113_fixes/production_readiness/b113_production_readiness_runtime_fix_full.patch.gz.b64" > /tmp/prod_ready.patch.gz
          echo '2d3257188f1fb07b1187ebf4bc0191f0e0672b0e9864d586ac09c50ef2dee76b  /tmp/prod_ready.patch.gz' | sha256sum -c -
          gzip -dc /tmp/prod_ready.patch.gz > /tmp/prod_ready.patch
          echo 'ee2352a9583309cf9fe0b8bb148a7a85f9df3828705b2474ca0eb74bb7e406a5  /tmp/prod_ready.patch' | sha256sum -c -
          git apply --check /tmp/prod_ready.patch
          git apply /tmp/prod_ready.patch

      - name: Verify production-readiness source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts
          grep -F 'versionCode = 113' /tmp/src/app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' /tmp/src/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/src/app/src/main')
          java=root/'java/tr/borsatakip/v5'
          gradle=Path('/tmp/src/app/build.gradle.kts').read_text()
          manifest=(root/'AndroidManifest.xml').read_text()
          ui=(java/'ui/BistScanActivity.kt').read_text()
          settings_ui=(java/'ui/SettingsActivity.kt').read_text()
          scheduler=(java/'worker/AutoScanScheduler.kt').read_text()
          service=(java/'worker/AutoScanForegroundService.kt').read_text()
          boot=(java/'worker/BootCompletedReceiver.kt').read_text()
          diag=(java/'data/RuntimeReadinessDiagnostics.kt').read_text()
          runner=(java/'worker/AutomaticScanRunner.kt').read_text()
          assert 'status.text = "Periyot desteklenmiyor"' not in ui
          assert 'WORK_MANAGER_MINUTES = 15' in scheduler
          assert 'ServiceCompat.startForeground' in service
          assert 'ACTION_BOOT_COMPLETED' in boot and 'ACTION_MY_PACKAGE_REPLACED' in boot
          assert 'RECEIVE_BOOT_COMPLETED' in manifest
          assert 'isIgnoringBatteryOptimizations' in diag
          assert 'resolveActivity' in diag and 'BIST:KIMMR' in diag
          assert 'BackendPreflightClient(this).checkBist()' in settings_ui
          assert 'experimentalFallbackOverride = false' in settings_ui
          assert '24/48/72' in settings_ui
          assert 'autoScanSuccessfulRuns' in runner and 'autoScanFailedRuns' in runner
          for key in ('BORSA_KEYSTORE_PATH','BORSA_STORE_PASSWORD','BORSA_KEY_ALIAS','BORSA_KEY_PASSWORD'):
              assert key in gradle
          assert 'allWarningsAsErrors = true' in gradle and '"-Werror"' in gradle
          print('Production readiness source contract: PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Require 188 of 188 Android tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failures=errors=skipped=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              total += int(r.attrib.get('tests',0))
              failures += int(r.attrib.get('failures',0))
              errors += int(r.attrib.get('errors',0))
              skipped += int(r.attrib.get('skipped',0))
          print(f'TEST_TOTAL={total} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}')
          if (total, failures, errors, skipped) != (188, 0, 0, 0):
              raise SystemExit(f'Expected 188/188 clean pass; got total={total}, failures={failures}, errors={errors}, skipped={skipped}')
          PY

      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='113'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/zipalign.txt
          mkdir -p /tmp/out
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B113-B114-PRODUCTION-READINESS-debug.apk
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          {
            echo 'B113/B114 PRODUCTION READINESS VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=113'
            echo 'versionName=5.2.5'
            echo 'android_tests=188/188 passed'
            echo 'compiler_warnings=BUILD_BLOCKING'
            echo 'boot_reschedule_contract=true'
            echo 'runtime_diagnostics=true'
            echo 'battery_optimization_diagnostics=true'
            echo 'tradingview_handler_diagnostics=true'
            echo 'soak_health_counters=true'
            echo 'release_signing=SUPPORTED_WITH_EXTERNAL_SECRET_KEYSTORE_ONLY'
            echo 'production_live_e2e=NOT_RUN_REQUIRES_REAL_BACKEND_AND_CREDENTIALS'
            echo 'KIMMR_live_crosscheck=NOT_RUN'
            echo 'physical_device_test=NOT_RUN'
            echo '24_48_72h_soak=NOT_RUN_REQUIRES_ELAPSED_DEVICE_TIME'
            echo 'signing=DEBUG'
            echo "apk_sha256=$SHA"
          } > /tmp/out/PROVENANCE.txt
          sha256sum "$OUT" > "$OUT.sha256"
          cp /tmp/apksigner.txt /tmp/out/APKSIGNER.txt
          cp /tmp/zipalign.txt /tmp/out/ZIPALIGN.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B113-B114-PRODUCTION-READINESS-APK
          path: /tmp/out/*
          retention-days: 90
