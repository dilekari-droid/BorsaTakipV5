name: Build V5.1.28 APK

on:
  push:
    branches: [ build-v5.1.28-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct V5.1.28 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5128
          cat build_payload/v5128_part*.b64 | tr -d '\n' | base64 -d > /tmp/v5128.tar.xz
          xz -t /tmp/v5128.tar.xz
          tar -xJf /tmp/v5128.tar.xz -C /tmp/v5128
          grep -F 'versionName = "5.1.28"' /tmp/v5128/app/build.gradle.kts
          grep -F 'versionCode = 78' /tmp/v5128/app/build.gradle.kts

      - name: Unit tests
        working-directory: /tmp/v5128
        run: gradle :app:testDebugUnitTest

      - name: Lint
        working-directory: /tmp/v5128
        run: gradle :app:lintDebug

      - name: Assemble debug APK
        working-directory: /tmp/v5128
        run: gradle :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=/tmp/v5128/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          tail -n 1 /tmp/apk-unzip-test.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "versionName='5.1.28'" /tmp/badging.txt
          cp "$APK" /tmp/BorsaTakipV5.1.28-debug.apk
          sha256sum /tmp/BorsaTakipV5.1.28-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.28-debug-apk
          path: /tmp/BorsaTakipV5.1.28-debug.apk
          if-no-files-found: error
