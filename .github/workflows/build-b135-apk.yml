name: B135 MTF Cache Fix APK

on:
  push:
    branches: [v525-b135-mtf-cache-fix]
    paths:
      - '.github/workflows/build-b135-apk.yml'
      - 'ci_payload/b135/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore B134 source and apply exact B135 patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b134
          mkdir -p /tmp/src /tmp/out /tmp/b134
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10543640533/zip" \
            -o /tmp/b134-artifact.zip
          unzip -q /tmp/b134-artifact.zip -d /tmp/b134
          SRCZIP=$(find /tmp/b134 -type f -name '*B134*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo 'f4762d15c48eed74e18164dc1e7d4d727783ee01d8eec833312fdb61121dafa5  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src

          echo 'e5b73820674c98f95516612a6bfd28ea498d125ea647c5a61f3180ffc9dd914a  ci_payload/b135/B135-MTF-CACHE-FIX.patch.gz.b64' | sha256sum -c -
          base64 -d ci_payload/b135/B135-MTF-CACHE-FIX.patch.gz.b64 > /tmp/B135.patch.gz
          echo '614ca22afc822d2d03a14d4f7eeea978c191eda77c298e27665ed11f4905c428  /tmp/B135.patch.gz' | sha256sum -c -
          gzip -dc /tmp/B135.patch.gz > /tmp/B135.patch
          echo '9f5a35412bf6aaa2a2c7cb34836eee8fa9574a5aef5dd3562475b4715d13cb8d  /tmp/B135.patch' | sha256sum -c -

          cd /tmp/src
          git init -q
          git add .
          git -c user.email=ci@example.invalid -c user.name=CI commit -qm baseline
          git apply --check /tmp/B135.patch
          git apply /tmp/B135.patch

          grep -F 'applicationId = "tr.borsatakip.v5"' app/build.gradle.kts
          grep -F 'versionCode = 135' app/build.gradle.kts
          grep -F 'versionName = "5.2.5"' app/build.gradle.kts

      - name: Static B135 integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/src')
          xmls=list((root/'app/src/main/res').rglob('*.xml'))+[root/'app/src/main/AndroidManifest.xml']
          for p in xmls: ET.parse(p)
          mtf=(root/'app/src/main/java/tr/borsatakip/v5/data/MtfHistoryCache.kt').read_text(encoding='utf-8')
          settings=(root/'app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt').read_text(encoding='utf-8')
          checks={
              'generation_guard': 'AtomicLong' in mtf and 'generation.incrementAndGet()' in mtf and 'generation.get() == loadGeneration' in mtf,
              'mtf_has_entries': 'fun hasEntries(): Boolean' in mtf,
              'cache_clear_mtf': 'val hadMtfCache = MtfHistoryCache.hasEntries()' in settings and 'MtfHistoryCache.clear()' in settings,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('B135_STATIC_FAIL='+','.join(bad))
          print(f'XML_PARSE=PASS files={len(xmls)}')
          print('B135_MTF_CACHE_GUARDS=PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests lint and assemble
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          D=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export D
          echo "UNIT_TEST_DISCOVERED=$D" | tee /tmp/out/TEST-SUMMARY.txt
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('/tmp/src/app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          d=int(os.environ['D'])
          line=f'UNIT_TEST_EXECUTED={t} UNIT_TEST_PASSED={t-f-e-s} UNIT_TEST_FAILURES={f} UNIT_TEST_ERRORS={e} UNIT_TEST_SKIPPED={s}'
          print(line)
          with open('/tmp/out/TEST-SUMMARY.txt','a') as fh:
              fh.write(line+'\nLINT_DEBUG=PASS\nASSEMBLE_DEBUG=PASS\n')
          if t!=d or f or e or s: raise SystemExit(line)
          PY

      - name: Verify APK and export
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/out/APK-ZIP-TEST.txt
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          SIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING=$($AAPT dump badging "$APK" | head -n1)
          echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='135'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          $SIGNER verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          $SIGNER verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          $ZIPALIGN -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt

          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B135-MTF-CACHE-FIX-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          rm -rf /tmp/src/.git /tmp/src/.gradle /tmp/src/.kotlin /tmp/src/app/build /tmp/src/build /tmp/src/.github
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src')
          out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B135-MTF-CACHE-FIX-Kaynak-Kod.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B135-MTF-CACHE-FIX-Kaynak-Kod.zip | tee /tmp/out/V5-ARACI-KURUM-5.2.5-B135-MTF-CACHE-FIX-Kaynak-Kod.zip.sha256
          {
            echo 'B135 MTF CACHE FIX'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=135'
            echo 'versionName=5.2.5'
            cat /tmp/out/TEST-SUMMARY.txt
            echo 'apk_zip_integrity=PASS'
            echo 'aapt_badging=PASS'
            echo 'apksigner_v2=PASS'
            echo 'zipalign=PASS'
            echo 'instrumentation_test=NOT_RUN'
            echo 'physical_device_test=NOT_RUN'
            echo 'signing=DEBUG'
            echo "workflow_commit=$GITHUB_SHA"
          } > /tmp/out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B135-MTF-CACHE-FIX-FINAL
          path: /tmp/out/*
          retention-days: 90
