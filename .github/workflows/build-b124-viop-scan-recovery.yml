name: B124 VIOP Scan Recovery
on:
  push:
    branches: [v525-b124-viop-scan-recovery]
    paths:
      - '.github/workflows/build-b124-viop-scan-recovery.yml'
      - 'ci_payload/b124_viop_scan_recovery/exact-*.b64'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified B123 source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b123 && mkdir -p /tmp/src /tmp/out /tmp/b123
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10465653492/zip" -o /tmp/b123-artifact.zip
          unzip -q /tmp/b123-artifact.zip -d /tmp/b123
          SRCZIP=$(find /tmp/b123 -type f -name '*B123*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo '25e50aeb742e12b3e56bd2211a73f517df7856537c886bea476cde664a66bb78  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'versionCode = 123' /tmp/src/app/build.gradle.kts
      - name: Reconstruct and apply exact B124 VIOP scan recovery patch
        shell: bash
        run: |
          set -euo pipefail
          echo '2a14add61cf70e57430ab952d01be51afbb6da2e42393e7ded3bd8f330cb703d  ci_payload/b124_viop_scan_recovery/exact-00.b64' | sha256sum -c -
          echo '0e9faeeb14bbf8b65e9560136a8bb7390136d6032387b679d69bff31f197511c  ci_payload/b124_viop_scan_recovery/exact-01.b64' | sha256sum -c -
          echo '2b50aa4dcdc575bae6895ba0c414bdab68dbd9358c217700e195803c9fd29019  ci_payload/b124_viop_scan_recovery/exact-02.b64' | sha256sum -c -
          cat ci_payload/b124_viop_scan_recovery/exact-00.b64 ci_payload/b124_viop_scan_recovery/exact-01.b64 ci_payload/b124_viop_scan_recovery/exact-02.b64 > /tmp/b124.b64
          test "$(wc -c < /tmp/b124.b64 | tr -d ' ')" = '8380'
          base64 -d /tmp/b124.b64 > /tmp/b124.patch.gz
          echo '77643466e641c50be6267feeeb8c22d3967bc4e2aacd7ac6549f1da383f0bf9f  /tmp/b124.patch.gz' | sha256sum -c -
          gzip -dc /tmp/b124.patch.gz > /tmp/b124.patch
          echo 'c0be5f5508724cb037c9645186ea1f247dd21784e6b01f5a6918a180f7939ffd  /tmp/b124.patch' | sha256sum -c -
          cd /tmp/src
          git apply --check /tmp/b124.patch
          git apply /tmp/b124.patch
          grep -F 'versionCode = 124' app/build.gradle.kts
          grep -F 'class ViopUnderlyingScanner' app/src/main/java/tr/borsatakip/v5/analysis/ViopUnderlyingScanner.kt
          grep -F 'runUnderlyingScan' app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          grep -F 'DAYANAK TARAMASINI BAŞLAT' app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          grep -F 'VİOP taraması BIST sonucundan bağımsızdır' app/src/main/java/tr/borsatakip/v5/worker/OpportunityWorker.kt
          cp /tmp/b124.patch /tmp/out/B124-VIOP-SCAN-RECOVERY.patch
          sha256sum /tmp/b124.patch > /tmp/out/B124-VIOP-SCAN-RECOVERY.patch.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Discover and require all Android unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY' | tee -a /tmp/test-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          d=int(os.environ['DISCOVERED']); t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          passed=t-f-e-s
          print(f'TEST_EXECUTED={t} TEST_PASSED={passed} TEST_FAILURES={f} TEST_ERRORS={e} TEST_SKIPPED={s}')
          if t != d or f or e or s: raise SystemExit(f'Test contract failed: discovered={d}, executed={t}, failures={f}, errors={e}, skipped={s}')
          PY
      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and export B124
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"; echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"; echo "$BADGING" | grep -F "versionCode='124'"; echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B124-VIOP-SCAN-RECOVERY-debug.apk
          cp "$APK" "$OUT"; sha256sum "$OUT" | tee "$OUT.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src'); out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B124-VIOP-SCAN-RECOVERY-Kaynak-Kod.zip'); excluded={'.git','.gradle','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(x in excluded for x in p.relative_to(src).parts): z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B124-VIOP-SCAN-RECOVERY-Kaynak-Kod.zip > /tmp/out/V5-ARACI-KURUM-5.2.5-B124-VIOP-SCAN-RECOVERY-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          {
            echo 'B124 VIOP SCAN RECOVERY VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'; echo 'versionCode=124'; echo 'versionName=5.2.5'
            echo 'b124_patch_sha256=c0be5f5508724cb037c9645186ea1f247dd21784e6b01f5a6918a180f7939ffd'
            echo 'viop_production_scan=UNCHANGED_REQUIRES_REAL_BACKEND'
            echo 'viop_underlying_scan=AVAILABLE_WITHOUT_VIOP_BACKEND'
            echo 'viop_underlying_scan_fake_contract_quote=NONE'
            echo 'viop_worker_independent_from_bist_empty=YES'
            cat /tmp/test-summary.txt
            echo 'production_live_e2e=NOT_RUN'; echo 'physical_device_test=NOT_RUN'; echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: B124-VIOP-SCAN-RECOVERY
          path: /tmp/out/*
          retention-days: 90
