name: B121 Provider Market Recovery
on:
  push:
    branches: [v525-b121-provider-market-recovery]
    paths:
      - '.github/workflows/build-b121-provider-market-recovery.yml'
      - 'ci_payload/b121_provider_market_recovery/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified B120 source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b120 && mkdir -p /tmp/src /tmp/out /tmp/b120
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10455732016/zip" \
            -o /tmp/b120-artifact.zip
          unzip -q /tmp/b120-artifact.zip -d /tmp/b120
          SRCZIP=$(find /tmp/b120 -type f -name '*B120*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo 'f877bd784e5471efa4c2a59bcf2b67117291e967213821dbcc53b4e2067d511a  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'versionCode = 120' /tmp/src/app/build.gradle.kts

      - name: Apply B121 provider and market recovery patch
        shell: bash
        run: |
          set -euo pipefail
          cp ci_payload/b121_provider_market_recovery/b121.patch.gz /tmp/b121.patch.gz
          echo 'b4e4f654cc64800f3056f856579a26513233f0aabbc7ec5933103f4372599d96  /tmp/b121.patch.gz' | sha256sum -c -
          gzip -dc /tmp/b121.patch.gz > /tmp/b121.patch
          echo '3e6973692927a01c8528c26d86bb04c7d76aa3f9fcc0dd17b400b42d2c09a4fa  /tmp/b121.patch' | sha256sum -c -
          cd /tmp/src
          git apply --check /tmp/b121.patch
          git apply /tmp/b121.patch
          grep -F 'versionCode = 121' app/build.gradle.kts
          grep -F 'Semaphore(4)' app/src/main/java/tr/borsatakip/v5/data/WatchlistDataResolver.kt
          grep -F 'fetchDisplayQuoteOnly' app/src/main/java/tr/borsatakip/v5/data/YahooFallbackProvider.kt
          grep -F 'TRY=X' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          grep -F 'XAUUSD=X' app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt
          grep -F 'BistBootstrapCatalog.defaultWatchlist' app/src/main/java/tr/borsatakip/v5/ui/FavoritesActivity.kt
          grep -F 'android:autoSizeTextType="uniform"' app/src/main/res/layout/activity_main.xml
          grep -F 'class B121ProviderAndMarketTilesTest' app/src/test/java/tr/borsatakip/v5/data/B121ProviderAndMarketTilesTest.kt
          cp /tmp/b121.patch /tmp/out/B121-PROVIDER-MARKET-RECOVERY.patch
          sha256sum /tmp/b121.patch > /tmp/out/B121-PROVIDER-MARKET-RECOVERY.patch.sha256

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Discover and require all Android unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY' | tee -a /tmp/test-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          discovered=int(os.environ['DISCOVERED'])
          total=failures=errors=skipped=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              total += int(r.attrib.get('tests',0))
              failures += int(r.attrib.get('failures',0))
              errors += int(r.attrib.get('errors',0))
              skipped += int(r.attrib.get('skipped',0))
          passed=total-failures-errors-skipped
          print(f'TEST_EXECUTED={total} TEST_PASSED={passed} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}')
          if total != discovered or failures or errors or skipped:
              raise SystemExit(f'Test contract failed: discovered={discovered}, executed={total}, failures={failures}, errors={errors}, skipped={skipped}')
          PY

      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify and export B121
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='121'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B121-PROVIDER-MARKET-RECOVERY-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src')
          out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B121-PROVIDER-MARKET-RECOVERY-Kaynak-Kod.zip')
          excluded={'.git','.gradle','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(src)
                  if any(part in excluded for part in rel.parts): continue
                  z.write(p,rel.as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B121-PROVIDER-MARKET-RECOVERY-Kaynak-Kod.zip > /tmp/out/V5-ARACI-KURUM-5.2.5-B121-PROVIDER-MARKET-RECOVERY-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          {
            echo 'B121 PROVIDER + MARKET RECOVERY VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=121'
            echo 'versionName=5.2.5'
            echo "source_branch=$GITHUB_REF_NAME"
            echo "source_commit=$GITHUB_SHA"
            echo 'b121_patch_sha256=3e6973692927a01c8528c26d86bb04c7d76aa3f9fcc0dd17b400b42d2c09a4fa'
            echo 'b121_new_regression_tests=6'
            echo 'watchlist_quote_independent_from_daily_history=YES'
            echo 'watchlist_concurrency_limit=4'
            echo 'watchlist_retry_backoff=3_ATTEMPTS_FOR_429_5XX_TRANSIENT_ERRORS'
            echo 'watchlist_errors=EXPLICIT_PROVIDER_DIAGNOSTICS'
            echo 'empty_watchlist_auto_seed=20_STARTER_SYMBOLS'
            echo 'home_bist100=PRODUCTION_THEN_DELAYED_PUBLIC_QUOTE'
            echo 'home_bist30=PRODUCTION_THEN_DELAYED_PUBLIC_QUOTE'
            echo 'home_usdtry=DELAYED_PUBLIC_QUOTE_IF_AVAILABLE'
            echo 'home_gold=SPOT_XAUUSD_THEN_GOLD_FUTURES_DISPLAY_FALLBACK'
            echo 'home_viop30=PRODUCTION_BACKEND_ONLY_NO_FAKE_PROXY'
            echo 'market_tile_value_wrap=SINGLE_LINE_AUTOSIZE'
            echo 'bist_scan_production_policy=UNCHANGED'
            cat /tmp/test-summary.txt
            echo 'production_live_e2e=NOT_RUN'
            echo 'yahoo_live_e2e=NOT_RUN'
            echo 'physical_device_test=NOT_RUN'
            echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B121-PROVIDER-MARKET-RECOVERY
          path: /tmp/out/*
          retention-days: 90
