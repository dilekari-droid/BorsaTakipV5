name: B129 Surgical Cancellation Cache Fix

on:
  push:
    branches: [v525-b129-cancellation-cache-race-fix]
    paths:
      - '.github/workflows/build-b129-surgical.yml'
      - 'ci_payload/b129_surgical/B129-SURGICAL.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified B128 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b128
          mkdir -p /tmp/src /tmp/out /tmp/b128
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10515878832/zip" \
            -o /tmp/b128-artifact.zip
          unzip -q /tmp/b128-artifact.zip -d /tmp/b128
          SRCZIP=$(find /tmp/b128 -type f -name '*B128*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo '1fccf5cbafda22d29bd892af0818a5d537cf73077b8d1a80f470fd888bbd5d51  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'applicationId = "tr.borsatakip.v5"' /tmp/src/app/build.gradle.kts
          grep -F 'versionCode = 128' /tmp/src/app/build.gradle.kts

      - name: Apply B129 surgical patch
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$GITHUB_WORKSPACE/ci_payload/b129_surgical/B129-SURGICAL.patch.gz.b64"
          base64 -d "$PAYLOAD" > /tmp/B129-SURGICAL.patch.gz
          gzip -t /tmp/B129-SURGICAL.patch.gz
          gzip -dc /tmp/B129-SURGICAL.patch.gz > /tmp/B129-SURGICAL.patch
          echo '7fea80a29c95ad16fcdfb0ef8239d8986afcc8c8d9e1ca3ac04ad2424734e47e  /tmp/B129-SURGICAL.patch' | sha256sum -c -
          patch -p1 --batch --forward < /tmp/B129-SURGICAL.patch
          grep -F 'versionCode = 129' app/build.gradle.kts
          grep -F 'mtfSourceGeneration.incrementAndGet()' app/src/main/java/tr/borsatakip/v5/data/ProviderRouter.kt
          grep -F 'client.newCall(request).awaitBody(label)' app/src/main/java/tr/borsatakip/v5/data/BackendProvider.kt
          grep -F 'MtfHistoryCache.loadOptionalFresh' app/src/main/java/tr/borsatakip/v5/scan/BistScanner.kt
          grep -F 'catch (_: Exception)' app/src/main/java/tr/borsatakip/v5/data/MtfHistoryCache.kt
          ! grep -Eq '^diff -ruN .*app/src/main/(res|java/.*/ui)/' /tmp/B129-SURGICAL.patch
          cp /tmp/B129-SURGICAL.patch /tmp/out/B129-SURGICAL.patch
          sha256sum /tmp/B129-SURGICAL.patch > /tmp/out/B129-SURGICAL.patch.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run all unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          discovered=int(os.environ['DISCOVERED'])
          tests=failures=errors=skipped=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
              skipped += int(root.attrib.get('skipped',0))
          passed=tests-failures-errors-skipped
          line=f'TEST_EXECUTED={tests} TEST_PASSED={passed} TEST_FAILURES={failures} TEST_ERRORS={errors} TEST_SKIPPED={skipped}'
          print(line)
          with open('/tmp/test-summary.txt','a',encoding='utf-8') as f: f.write(line+'\n')
          if tests != discovered or failures or errors or skipped:
              raise SystemExit(line)
          PY

      - name: Lint debug
        working-directory: /tmp/src
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Assemble debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify and export B129
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"
          echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='129'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt

          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B129-CANCELLATION-CACHE-RACE-FIX-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src')
          out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B129-CANCELLATION-CACHE-RACE-FIX-Kaynak-Kod.zip')
          excluded={'.git','.gradle','.kotlin','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(part in excluded for part in p.relative_to(src).parts):
                      z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B129-CANCELLATION-CACHE-RACE-FIX-Kaynak-Kod.zip | tee /tmp/out/V5-ARACI-KURUM-5.2.5-B129-CANCELLATION-CACHE-RACE-FIX-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          cp /tmp/src/B129_CHANGES.md /tmp/out/B129_CHANGES.md
          {
            echo 'B129 SURGICAL CANCELLATION + CACHE RACE FIX'
            echo 'applicationId=tr.borsatakip.v5'
            echo 'versionCode=129'
            echo 'versionName=5.2.5'
            echo 'architecture_rewrite=NO'
            echo 'ui_layout_navigation_changes=NO'
            echo 'provider_router_aba_generation_guard=ENABLED'
            echo 'viop_okhttp_coroutine_cancellation=ENABLED'
            echo 'backend_result_cancellation_rethrow=ENABLED'
            echo 'bist_mtf_cancellation_rethrow=ENABLED'
            echo 'market_regime_cancellation_rethrow=ENABLED'
            echo 'optional_mtf_catch_scope=EXCEPTION_NOT_THROWABLE'
            cat /tmp/test-summary.txt
            echo 'production_viop_live_e2e=NOT_RUN_NO_REAL_BACKEND_CREDENTIALS'
            echo 'physical_device_test=NOT_RUN'
            echo 'instrumentation_test=NOT_RUN_NO_EMULATOR_OR_DEVICE'
            echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B129-CANCELLATION-CACHE-RACE-FIX-FINAL
          path: /tmp/out/*
          retention-days: 90
