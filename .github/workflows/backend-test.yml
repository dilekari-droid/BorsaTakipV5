name: Backend Contract Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency resolution
        run: pip check

      - name: Compile backend
        run: python -m compileall app

      - name: Contract and provenance tests
        run: python -m pytest -q tests

      - name: Verify no real secrets or fake production endpoints are committed
        run: |
          set -euo pipefail
          ! grep -R -n -E 'provider\.example|api\.example\.com|BORSA_UPSTREAM_TOKEN=.{4,}|BORSA_BACKEND_API_KEY=[A-Za-z0-9_-]{20,}' . --exclude-dir=.git --exclude='*.md'
          for key in \
            BORSA_SYMBOLS_URL \
            BORSA_QUOTE_URL_TEMPLATE \
            BORSA_HISTORY_URL_TEMPLATE \
            BORSA_VIOP_URL \
            BORSA_VIOP_QUOTE_URL_TEMPLATE \
            BORSA_VIOP_HISTORY_URL_TEMPLATE; do
            grep -Fq "$key=" .env.example || { echo "Missing deployment variable in .env.example: $key"; exit 1; }
          done
          grep -Fq 'LicensedUpstreamProvider' app/provider_adapter.py

      - name: Verify backend README matches implemented Android contract
        run: |
          set -euo pipefail
          for endpoint in \
            '/v1/health' \
            '/v1/preflight' \
            '/v1/bist/symbols' \
            '/v1/bist/quote/{symbol}' \
            '/v1/bist/history/{symbol}' \
            '/v1/viop/contracts' \
            '/v1/viop/quote/{symbol}' \
            '/v1/viop/history/{symbol}'; do
            grep -Fq "$endpoint" README.md || { echo "README contract missing: $endpoint"; exit 1; }
            grep -Fq "$endpoint" app/main.py || { echo "Backend route missing: $endpoint"; exit 1; }
          done
          grep -Fq 'BORSA_VIOP_QUOTE_URL_TEMPLATE' README.md
          grep -Fq 'BORSA_VIOP_HISTORY_URL_TEMPLATE' README.md
          grep -Fq 'configurationReady' README.md
          grep -Fq 'viopConfigured' README.md

      - name: Docker build smoke test
        run: docker build -t borsatakip-backend-ci .
