name: Android UI Runtime Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ui-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            mkdir -p ui-screenshots
            adb shell find /sdcard/Android/data/tr.borsatakip.v5/files -name '*.png' -print || true
            adb pull /sdcard/Android/data/tr.borsatakip.v5/files/ui-screenshots ui-screenshots || true
            find ui-screenshots -type f -maxdepth 3 -print || true

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.27-ui-runtime-screenshots
          path: ui-screenshots/**/*.png
          if-no-files-found: warn

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.27-ui-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
