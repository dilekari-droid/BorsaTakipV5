name: B125 VIOP Strict Integrity
on:
  push:
    branches: [v525-b125-viop-strict-integrity]
    paths:
      - '.github/workflows/build-b125-viop-strict-integrity.yml'
      - 'ci_payload/b125_viop_strict_integrity/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified B124 source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b124 && mkdir -p /tmp/src /tmp/out /tmp/b124
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10483833752/zip" -o /tmp/b124-artifact.zip
          unzip -q /tmp/b124-artifact.zip -d /tmp/b124
          SRCZIP=$(find /tmp/b124 -type f -name '*B124*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo '9f0dcba5c9cc829b178f59212789e34005b7ca7ef76933d41a7330bd70043bda  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'versionCode = 124' /tmp/src/app/build.gradle.kts
      - name: Apply B125 strict VIOP patch
        shell: bash
        run: |
          set -euo pipefail
          cp ci_payload/b125_viop_strict_integrity/b125.patch.gz /tmp/b125.patch.gz
          cp ci_payload/b125_viop_strict_integrity/b125-extras.patch /tmp/b125-extras.patch
          echo '1717b400a5468fe8bfb21efce0cebe6df2d4910e9a5e85cb463d410b4b356dae  /tmp/b125.patch.gz' | sha256sum -c -
          echo 'd100cb64ec30006e41b34044a3b9ae4abaa6fca0e87cd1e3fc6b40c43d4d1bc6  /tmp/b125-extras.patch' | sha256sum -c -
          gzip -dc /tmp/b125.patch.gz > /tmp/b125.patch
          echo '91d6ba2dce1f3b04b9ead6f1a864cfb3a38bbd4f11fa8dc6af6086c1685b6afa  /tmp/b125.patch' | sha256sum -c -
          cd /tmp/src
          git apply --check /tmp/b125.patch
          git apply /tmp/b125.patch
          git apply --check /tmp/b125-extras.patch
          git apply /tmp/b125-extras.patch
          grep -F 'versionCode = 125' app/build.gradle.kts
          grep -F 'QUOTE_ERROR: Sembol kimliği eksik.' app/src/main/java/tr/borsatakip/v5/data/BackendProvider.kt
          grep -F 'HISTORY_ERROR: lastBarClosed eksik.' app/src/main/java/tr/borsatakip/v5/data/BackendProvider.kt
          grep -F 'fetchExternalTechnicalStock' app/src/main/java/tr/borsatakip/v5/data/YahooFallbackProvider.kt
          grep -F 'maxExchangeAgeMs = MTF_1M_MAX_EXCHANGE_AGE_MS' app/src/main/java/tr/borsatakip/v5/analysis/ViopScanner.kt
          grep -F 'object ViopUnderlyingTickerMap' app/src/main/java/tr/borsatakip/v5/data/ViopUnderlyingTickerMap.kt
          grep -F 'class B125ViopStrictIntegrityTest' app/src/test/java/tr/borsatakip/v5/data/B125ViopStrictIntegrityTest.kt
          cp /tmp/b125.patch /tmp/out/B125-VIOP-STRICT-INTEGRITY.patch
          cp /tmp/b125-extras.patch /tmp/out/B125-VIOP-STRICT-INTEGRITY-EXTRAS.patch
          sha256sum /tmp/b125.patch > /tmp/out/B125-VIOP-STRICT-INTEGRITY.patch.sha256
          sha256sum /tmp/b125-extras.patch > /tmp/out/B125-VIOP-STRICT-INTEGRITY-EXTRAS.patch.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Discover and require all JVM unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          test "$DISCOVERED" -eq 279
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY' | tee -a /tmp/test-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          d=int(os.environ['DISCOVERED']); t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          passed=t-f-e-s
          print(f'TEST_EXECUTED={t} TEST_PASSED={passed} TEST_FAILURES={f} TEST_ERRORS={e} TEST_SKIPPED={s}')
          if t != d or f or e or s: raise SystemExit(f'Test contract failed: discovered={d}, executed={t}, failures={f}, errors={e}, skipped={s}')
          PY
      - name: Compile Android instrumentation tests
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebugAndroidTest --stacktrace
      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and export B125
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"; echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -F "versionCode='125'"
          echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-STRICT-INTEGRITY-debug.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          rm -rf /tmp/src/.kotlin /tmp/src/.gradle /tmp/src/app/build /tmp/src/build
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src'); out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-STRICT-INTEGRITY-Kaynak-Kod.zip')
          excluded={'.git','.gradle','.kotlin','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(x in excluded for x in p.relative_to(src).parts):
                      z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-STRICT-INTEGRITY-Kaynak-Kod.zip > /tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-STRICT-INTEGRITY-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          {
            echo 'B125 VIOP STRICT INTEGRITY VERIFIED DEBUG BUILD'
            echo 'applicationId=tr.borsatakip.v5'; echo 'versionCode=125'; echo 'versionName=5.2.5'
            echo 'b125_patch_sha256=91d6ba2dce1f3b04b9ead6f1a864cfb3a38bbd4f11fa8dc6af6086c1685b6afa'
            echo 'b125_extras_patch_sha256=d100cb64ec30006e41b34044a3b9ae4abaa6fca0e87cd1e3fc6b40c43d4d1bc6'
            echo 'viop_quote_symbol_identity=REQUIRED_FAIL_CLOSED'
            echo 'viop_history_symbol_identity=REQUIRED_FAIL_CLOSED'
            echo 'viop_history_malformed_candle=REJECT_WHOLE_RESPONSE'
            echo 'viop_history_closed_bar_metadata=REQUIRED'
            echo 'viop_decision_price=HISTORY_ONLY_NO_LIVE_FALLBACK'
            echo 'viop_mtf_exchange_freshness=ENFORCED'
            echo 'viop_underlying_external_ticker_mapping=USDTRY,EURTRY,GOLD,SILVER,BRENT,XU030'
            echo 'retry_jitter=YES'
            echo 'source_package_kotlin_artifacts=EXCLUDED'
            cat /tmp/test-summary.txt
            echo 'android_instrumentation_compile=PASSED'
            echo 'android_instrumentation_run=NOT_RUN'
            echo 'production_viop_live_e2e=NOT_RUN'
            echo 'yahoo_live_e2e=NOT_RUN'
            echo 'physical_device_test=NOT_RUN'
            echo 'release_signing=NOT_AVAILABLE'
            echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: B125-VIOP-STRICT-INTEGRITY
          path: /tmp/out/*
          retention-days: 90
