name: B125 VIOP Usable Fallback
on:
  push:
    branches: [v525-b125-viop-usable-fallback]
    paths:
      - '.github/workflows/build-b125-viop-usable-fallback.yml'
      - 'ci_payload/b125_viop_usable_fallback/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified B124 source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/out /tmp/b124 && mkdir -p /tmp/src /tmp/out /tmp/b124
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/dilekari-droid/BorsaTakipV5/actions/artifacts/10466926970/zip" -o /tmp/b124-artifact.zip
          unzip -q /tmp/b124-artifact.zip -d /tmp/b124
          SRCZIP=$(find /tmp/b124 -type f -name '*B124*Kaynak-Kod.zip' | head -n1)
          test -n "$SRCZIP" -a -s "$SRCZIP"
          echo '499f0b1d641455e2a605f7ae788a5751a0e7f2748727008aa4eb81e574982b0b  '"$SRCZIP" | sha256sum -c -
          unzip -q "$SRCZIP" -d /tmp/src
          grep -F 'versionCode = 124' /tmp/src/app/build.gradle.kts
      - name: Apply B125 VIOP usable fallback patch
        shell: bash
        run: |
          set -euo pipefail
          cp ci_payload/b125_viop_usable_fallback/b125.patch.gz /tmp/b125.patch.gz
          echo 'bc42b675164870190e7e5277a439aef1160b56d60b047d3d14ed09a08e297985  /tmp/b125.patch.gz' | sha256sum -c -
          gzip -dc /tmp/b125.patch.gz > /tmp/b125.patch
          echo 'aa14d72d1691d42fa6f50ddad12bad14c243544fcc8930d3526871166bf7cb22  /tmp/b125.patch' | sha256sum -c -
          cd /tmp/src
          git apply --check /tmp/b125.patch
          git apply /tmp/b125.patch
          grep -F 'versionCode = 125' app/build.gradle.kts
          grep -F 'maybeAutoRunUnderlyingWatchScan' app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          grep -F 'D: dayanak fiyatı' app/src/main/java/tr/borsatakip/v5/ui/ViopContractsActivity.kt
          grep -F 'renderUnderlyingWatchIfAvailable' app/src/main/java/tr/borsatakip/v5/ui/ViopDetailActivity.kt
          grep -F 'loadViop30UnderlyingFallback' app/src/main/java/tr/borsatakip/v5/ui/MarketInstrumentDetailActivity.kt
          cp /tmp/b125.patch /tmp/out/B125-VIOP-USABLE-FALLBACK.patch
          sha256sum /tmp/b125.patch > /tmp/out/B125-VIOP-USABLE-FALLBACK.patch.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Discover and require all Android unit tests
        working-directory: /tmp/src
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERED=$(grep -Rho '@Test' app/src/test --include='*.kt' | wc -l | tr -d ' ')
          export DISCOVERED
          echo "TEST_DISCOVERED=$DISCOVERED" | tee /tmp/test-summary.txt
          gradle --no-daemon testDebugUnitTest --stacktrace
          python3 - <<'PY' | tee -a /tmp/test-summary.txt
          import glob, os, xml.etree.ElementTree as ET
          d=int(os.environ['DISCOVERED']); t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          passed=t-f-e-s
          print(f'TEST_EXECUTED={t} TEST_PASSED={passed} TEST_FAILURES={f} TEST_ERRORS={e} TEST_SKIPPED={s}')
          if t != d or f or e or s: raise SystemExit(f'Test contract failed: discovered={d}, executed={t}, failures={f}, errors={e}, skipped={s}')
          PY
      - name: Build debug APK
        working-directory: /tmp/src
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify and export B125
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          BADGING="$($AAPT dump badging "$APK" | head -n1)"; echo "$BADGING" | tee /tmp/out/BADGING.txt
          echo "$BADGING" | grep -F "name='tr.borsatakip.v5'"; echo "$BADGING" | grep -F "versionCode='125'"; echo "$BADGING" | grep -F "versionName='5.2.5'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/out/APKSIGNER.txt
          "$APKSIGNER" verify --verbose "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$ZIPALIGN" -c -v 4 "$APK" | tee /tmp/out/ZIPALIGN.txt
          OUT=/tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-USABLE-FALLBACK-debug.apk
          cp "$APK" "$OUT"; sha256sum "$OUT" | tee "$OUT.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('/tmp/src'); out=Path('/tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-USABLE-FALLBACK-Kaynak-Kod.zip'); excluded={'.git','.gradle','build'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob('*'):
                  if p.is_file() and not any(x in excluded for x in p.relative_to(src).parts): z.write(p,p.relative_to(src).as_posix())
          PY
          sha256sum /tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-USABLE-FALLBACK-Kaynak-Kod.zip > /tmp/out/V5-ARACI-KURUM-5.2.5-B125-VIOP-USABLE-FALLBACK-Kaynak-Kod.zip.sha256
          cp /tmp/test-summary.txt /tmp/out/TEST-SUMMARY.txt
          {
            echo 'B125 VIOP USABLE FALLBACK VERIFIED BUILD'
            echo 'applicationId=tr.borsatakip.v5'; echo 'versionCode=125'; echo 'versionName=5.2.5'
            echo 'b125_patch_sha256=aa14d72d1691d42fa6f50ddad12bad14c243544fcc8930d3526871166bf7cb22'
            echo 'viop_real_provider_path=UNCHANGED'
            echo 'viop_missing_provider_mode=AUTO_UNDERLYING_WATCH'
            echo 'viop_contract_rows_underlying_overlay=YES_EXPLICIT_D_PREFIX'
            echo 'viop_fake_contract_price=NONE'
            echo 'viop_detail_underlying_watch=YES_WHEN_PROVIDER_MISSING'
            echo 'viop30_card_detail_underlying_fallback=YES_EXPLICIT_WARNING'
            cat /tmp/test-summary.txt
            echo 'production_viop_live_e2e=NOT_RUN'; echo 'physical_device_test=NOT_RUN'; echo 'signing=DEBUG'
          } > /tmp/out/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: B125-VIOP-USABLE-FALLBACK
          path: /tmp/out/*
          retention-days: 90
