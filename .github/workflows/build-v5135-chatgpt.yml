name: Build V5.1.36 CAHT6 APK

on:
  push:
    branches:
      - chatgpt/build-v5136-caht6-patch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified V5.1.35 source and apply V5.1.36 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_v5135 /tmp/v5135_source.tar.xz /tmp/v5135_source.b64 /tmp/v5136.patch.xz /tmp/v5136.patch
          mkdir -p build_v5135
          cat \
            build_payload/v5135_chatgpt_source_part_00.b64 \
            build_payload/v5135_chatgpt_source_part_01a.b64 \
            build_payload/v5135_chatgpt_source_part_01b.b64 \
            build_payload/v5135_chatgpt_source_part_01c.b64 \
            build_payload/v5135_chatgpt_source_part_02.b64 \
            build_payload/v5135_chatgpt_source_part_03.b64 \
            build_payload/v5135_chatgpt_source_part_04.b64 \
            build_payload/v5135_chatgpt_source_part_05.b64 \
            build_payload/v5135_chatgpt_source_part_06.b64 \
            build_payload/v5135_chatgpt_source_part_07.b64 \
            > /tmp/v5135_source.b64
          test "$(wc -c < /tmp/v5135_source.b64)" -eq 134444
          echo "dc7f579dd5119bb925be2bdf382ec689da2c4cea7ea1a316335acdda029a5c94  /tmp/v5135_source.b64" | sha256sum -c -
          base64 --decode /tmp/v5135_source.b64 > /tmp/v5135_source.tar.xz
          echo "845bb7c3dba09142119ad507fb05cd9386e2a0ffb266f197fd8544f5cee087b6  /tmp/v5135_source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v5135_source.tar.xz -C build_v5135
          grep -Fq 'versionName = "5.1.35"' build_v5135/app/build.gradle.kts
          grep -Fq 'versionCode = 85' build_v5135/app/build.gradle.kts

          test "$(wc -c < build_payload/v5136.patch.xz.b64)" -eq 12664
          echo "341adc7c34713ae95176b8e7fbfb21d40fa0177f1d1822c74497d6f41ee0758b  build_payload/v5136.patch.xz.b64" | sha256sum -c -
          base64 --decode build_payload/v5136.patch.xz.b64 > /tmp/v5136.patch.xz
          echo "fdc53b2a361eb2779ee31a1825d3b951c37bd18eaa4f1b51f04035684b06a921  /tmp/v5136.patch.xz" | sha256sum -c -
          xz -dc /tmp/v5136.patch.xz > /tmp/v5136.patch
          test "$(wc -c < /tmp/v5136.patch)" -eq 38502
          echo "4b6d891a81a3ec90215f725fc54150078e928e79934c72a84dc66dce112d2b11  /tmp/v5136.patch" | sha256sum -c -
          cd build_v5135
          patch -p1 < /tmp/v5136.patch
          grep -Fq 'versionName = "5.1.36"' app/build.gradle.kts
          grep -Fq 'versionCode = 86' app/build.gradle.kts

      - name: Run Android unit tests and build debug APK
        working-directory: build_v5135
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build_v5135/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p dist
          cp "$APK" dist/BorsaTakipV5.1.36-CAHT6-debug.apk
          sha256sum dist/BorsaTakipV5.1.36-CAHT6-debug.apk > dist/BorsaTakipV5.1.36-CAHT6-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakipV5.1.36-CAHT6-debug-apk
          path: |
            dist/BorsaTakipV5.1.36-CAHT6-debug.apk
            dist/BorsaTakipV5.1.36-CAHT6-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
